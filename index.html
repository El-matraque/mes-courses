/* ---- Catalogue : parcours par rayon puis par famille ----
   Pensé pour tenir la charge quand le catalogue passe de 74 à 300+ réf :
   rayons repliés par défaut, familles regroupées, recherche qui déplie. */
let catQuery="", catOpen=new Set();
function groupCatalog(list){
  const byRay=new Map();
  for(const c of list){
    const r=c.cat||"📝 Autres";
    if(!byRay.has(r)) byRay.set(r,new Map());
    const fams=byRay.get(r);
    const f=c.famille||c.id;
    if(!fams.has(f)) fams.set(f,[]);
    fams.get(f).push(c);
  }
  return byRay;
}
function famLabel(f){ return String(f).replace(/-/g," "); }
function productRow(c){
  const best=bestStoreFor(c,1);
  const partial=!isComparable(c);
  const inList=state.items.some(i=>i.catalogId===c.id);
  const up = best ? unitPrice(c, best.cost, 1) : null;
  const price = best
    ? `<b>${fmt(best.cost)}</b> chez ${esc(best.store.name)}${up?` · ${fmt(up.v)}/${UNIT_LABEL[up.u]}`:""}${partial?" · prix partiels":""}`
    : `aucun prix connu`;
  return `<div class="prod">
    <div class="pmain">
      <div class="pname">${esc(c.name)}</div>
      <div class="psub">${esc(c.unit||"")}${c.unit?" · ":""}${price}${partial?` <span class="pTag" title="Prix non relevés dans toutes les enseignes">🔍</span>`:""}</div>
    </div>
    <button class="addP ${inList?"in":""}" data-add="${esc(c.id)}" aria-label="Ajouter ${esc(c.name)}">${inList?"✓":"+"}</button>
  </div>`;
}
function renderCatalogue(){
  const body=$("#catBody"), countEl=$("#catCount");
  const q=norm(catQuery.trim());
  const all=DATA.catalog;
  const hits = q ? all.filter(c=>norm(c.name).includes(q)||norm(famLabel(c.famille||"")).includes(q)) : all;

  countEl.textContent = q
    ? `${hits.length} résultat(s) pour « ${catQuery.trim()} » sur ${all.length} produits`
    : `${all.length} produits · ${new Set(all.map(c=>c.cat||"📝 Autres")).size} rayons — touche un rayon pour l'ouvrir`;

  if(all.length===0){
    body.innerHTML=`<div class="empty"><div class="big">${I.book}</div><b>Catalogue vide</b><div class="small">Aucun prix relevé pour l'instant. Les produits apparaîtront ici au fur et à mesure des relevés en magasin, ajoutés dans <code>data/prix.csv</code>.</div></div>`;
    return;
  }
  if(hits.length===0){
    body.innerHTML=`<div class="empty"><div class="big">${I.search}</div><b>Aucun produit trouvé</b><div class="small">Essaie un autre mot, ou ajoute-le comme article libre depuis l'onglet Liste.</div></div>`;
    return;
  }
  const byRay=groupCatalog(hits);
  const rayons=[...byRay.keys()].sort((a,b)=>a.localeCompare(b,"fr"));
  let html="";
  rayons.forEach((r,ri)=>{
    const fams=byRay.get(r);
    const n=[...fams.values()].reduce((a,arr)=>a+arr.length,0);
    const open = q ? true : catOpen.has(r);
    html+=`<div class="ray">
      <button class="rayHead" data-ray="${ri}">
        <span>${esc(r)}</span>
        <span class="rayN">${n}<span class="chev">${open?"▾":"▸"}</span></span>
      </button>`;
    if(open){
      html+=`<div class="rayBody">`;
      const famKeys=[...fams.keys()].sort((a,b)=>famLabel(a).localeCompare(famLabel(b),"fr"));
      for(const f of famKeys){
        /* Tri par rapport qualité-prix : €/kg quand c'est calculable, sinon prix paquet */
        const key=c=>{
          const b=bestStoreFor(c,1); if(!b) return Infinity;
          const up=unitPrice(c, b.cost, 1);
          return up ? up.v : b.cost;
        };
        const prods=[...fams.get(f)].sort((a,b)=>key(a)-key(b));
        if(prods.length>1) html+=`<div class="famHead">${esc(famLabel(f))} · ${prods.length}</div>`;
        html+=prods.map(productRow).join("");
      }
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  body.innerHTML=html;
  body.querySelectorAll("[data-ray]").forEach(b=>b.onclick=()=>{
    const r=rayons[+b.dataset.ray];
    catOpen.has(r) ? catOpen.delete(r) : catOpen.add(r);
    renderCatalogue();
  });
  body.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addItem(b.dataset.add,null));
}

/* ---- Liste ---- */
/* Suggestions de départ : dérivées du catalogue réel, jamais codées en dur —
   une liste figée d'ids renverrait des boutons vides après une purge. */
function popularPicks(n){
  const seen=new Set(), out=[], rest=[];
  for(const c of DATA.catalog){
    if(!bestStoreFor(c,1)) continue;
    if(seen.has(c.famille)){ rest.push(c); continue; }   // une famille = une suggestion…
    seen.add(c.famille); out.push(c);
  }
  return out.concat(rest).slice(0,n);                    // …puis on complète si le catalogue est étroit
}
function renderList(){
  const body=$("#listBody");
  const sug = suggestionsHtml();
  if(state.items.length===0){
    body.innerHTML = sug + `
      <div class="empty">
        <div class="big">${I.cart}</div>
        <div><b>Ta liste est vide</b></div>
        <div class="small">Ouvre l'onglet <b>Produits</b> et tape sur vos tuiles — ou cherche ci-dessus.</div>
        <div class="chips"><button class="chip" id="goProduits">Voir vos produits</button></div>
      </div>`;
    bindSuggestions(body);
    const g=body.querySelector("#goProduits"); if(g) g.onclick=()=>switchView("produits");
    return;
  }
  let html="";
  const items = enrichedItems();

  /* Bandeau de coût : ce qui est déjà dans le caddie (articles cochés),
     ce qui reste à prendre, et le total — chaque article estimé au
     meilleur prix connu (même base que la répartition optimale des
     Paniers). Les articles sans prix sont comptés à part, pas devinés. */
  let doneCost=0, restCost=0, unpriced=0;
  for(const it of items){
    const best = it.cat ? bestStoreFor(it.cat, it.qty) : null;
    if(!best){ unpriced++; continue; }
    if(it.checked) doneCost += best.cost; else restCost += best.cost;
  }
  const nDone = items.filter(i=>i.checked).length;
  html += `<div class="costBar">
    <span class="cbDone">${fmt(doneCost)} <span class="cbLbl">caddie</span></span>
    <span class="cbSep">·</span>
    <span>${fmt(restCost)} <span class="cbLbl">restant</span></span>
    <span class="cbSep">·</span>
    <span><b>${fmt(doneCost+restCost)}</b> <span class="cbLbl">total${unpriced?" (+"+unpriced+" ?)":""}</span></span>
  </div>`;

  const groups = {};
  for(const it of items){
    const g = it.cat ? it.cat.cat : "📝 Autres articles";
    (groups[g]=groups[g]||[]).push(it);
  }
  for(const [g,arr] of Object.entries(groups)){
    html+=`<div class="catTitle">${esc(g)}</div>`;
    for(const it of arr){
      const best = it.cat ? bestStoreFor(it.cat, it.qty) : null;
      let sub;
      if(it.orphan)    sub = "retiré du catalogue — plus de prix associé";
      else if(!it.cat) sub = "article libre — non comparé";
      else if(!best)   sub = esc(it.cat.unit)+" · aucun prix connu";
      else{
        const partial = !isComparable(it.cat);
        sub = esc(it.cat.unit)+" · "+(partial?"dès "+fmt(best.cost/it.qty)+" chez "+esc(best.store.name)+" (prix partiels)"
                                             :"dès "+fmt(best.cost/it.qty)+" chez "+esc(best.store.name));
      }
      html+=`
      <div class="item ${it.checked?"checked":""}" data-uid="${it.uid}">
        <button class="ck" data-act="check">${it.checked?"✓":""}</button>
        <div class="imain" data-act="check">
          <div class="iname">${esc(it.name)}</div>
          <div class="isub">${sub}</div>
        </div>
        <div class="qty">
          <button data-act="minus" aria-label="${it.qty<=1?"Retirer":"Moins"}">−</button><span>${it.qty}</span><button data-act="plus">+</button>
        </div>
      </div>`;
      if(it.cat) html+=stepBox(it);
      /* substitut : meilleur produit équivalent (même famille) à quantité
         égale — c'est ici qu'« Œufs Boni » se compare aux autres œufs */
      if(!it.checked){
        const alt=alternativesFor(it)[0];
        if(alt){
          const detail = alt.up
            ? `${fmt(alt.up.v)}/${UNIT_LABEL[alt.up.u]} chez ${esc(alt.best.store.name)} (tu es à ${fmt(alt.curUP.v)}/${UNIT_LABEL[alt.curUP.u]})`
            : `${fmt(alt.best.cost)} chez ${esc(alt.best.store.name)}`;
          const pe=alt.c.prices[alt.best.store.id], pr=pe&&pe.promo;
          html+=`<div class="altHint">
            <span class="altTxt"><span class="altSave">−${Math.round(alt.gain*100)}%</span> <b>${esc(alt.c.name)}</b> · ${detail}${pr?` <span class="promoTag">${promoLabel(pr)}</span>`:""}</span>
            <button class="altBtn" data-swap="${it.uid}" data-to="${esc(alt.c.id)}">Remplacer</button>
          </div>`;
        }
      }
    }
  }
  const nChecked=items.filter(i=>i.checked).length;
  if(nChecked>0){
    html+=`<div class="bactions" style="margin-top:16px">
      <button class="primaryBtn" id="finishShop">Terminer les courses (${nChecked} coché${nChecked>1?"s":""})</button>
    </div>`;
  }
  body.innerHTML=sug+html;
  bindSuggestions(body);
  const fin=body.querySelector("#finishShop");
  if(fin) fin.onclick=()=>{
    state.items=state.items.filter(i=>!i.checked);
    saveState(); render();
    toast(`Courses terminées — ${nChecked} article${nChecked>1?"s":""} retiré${nChecked>1?"s":""}`);
  };
  body.querySelectorAll(".item").forEach(el=>{
    const uid=el.dataset.uid;
    el.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>itemAction(uid,b.dataset.act));
  });
  body.querySelectorAll("[data-swap]").forEach(b=>b.onclick=()=>swapItem(b.dataset.swap, b.dataset.to));
  body.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>setQty(b.dataset.step, +b.dataset.to));
}

/* ---- Suggestions de Claude ------------------------------------------
   La liste de courses vit dans le navigateur : Claude ne peut donc pas y
   écrire directement. Il alimente data/suggestions.csv, versionné dans le
   repo, et l'app propose ici de les reprendre en un tap. C'est le canal
   par lequel « Claude ajoute quelque chose à la liste ». */
function activeSuggestions(){
  return SUGGEST.filter(s=>
    !stock.dismissed.includes(s.id) &&
    !state.items.some(i=>i.catalogId===s.id || (!i.catalogId && i.name===s.nom))
  );
}
function suggestionsHtml(){
  const list=activeSuggestions();
  if(!list.length) return "";
  return `<div class="card sugCard">
    <b>${list.length} suggestion(s) de Claude</b>
    ${list.map(s=>`<div class="sugRow">
      <span class="sugTxt"><b>${esc(s.nom)}</b>${s.raison?` <span class="muted small">— ${esc(s.raison)}</span>`:""}</span>
      <button class="sugAdd" data-sugadd="${esc(s.id)}">+</button>
      <button class="sugNo" data-sugno="${esc(s.id)}" aria-label="Refuser">✕</button>
    </div>`).join("")}
    <div class="bactions"><button data-sugall="1">+ Tout ajouter</button></div>
  </div>`;
}
function bindSuggestions(body){
  const take=s=>{
    if(s.id && catItem(s.id)) addItemSilent(s.id, null);
    else addItemSilent(null, s.nom);
  };
  body.querySelectorAll("[data-sugadd]").forEach(b=>b.onclick=()=>{
    const s=SUGGEST.find(x=>x.id===b.dataset.sugadd); if(!s) return;
    take(s); saveState(); render(); toast("Ajouté : "+s.nom);
  });
  body.querySelectorAll("[data-sugno]").forEach(b=>b.onclick=()=>{
    stock.dismissed.push(b.dataset.sugno); saveStock(); render();
  });
  const all=body.querySelector("[data-sugall]");
  if(all) all.onclick=()=>{
    const list=activeSuggestions();
    list.forEach(take); saveState(); render();
    toast(`${list.length} suggestion(s) ajoutée(s)`);
  };
}

function itemAction(uid, act){
  const it = state.items.find(i=>String(i.uid)===String(uid));
  if(!it) return;
  if(act==="plus") it.qty++;
  if(act==="minus"){
    if(it.qty<=1){ state.items=state.items.filter(i=>i!==it); toast("Retiré : "+it.name); }
    else it.qty--;
  }
  if(act==="check") it.checked=!it.checked;
  saveState(); render();
}

/* Ajout sans toast ni rendu — pour les ajouts en lot (réassort de stock) */
function addItemSilent(catalogId, freeName){
  if(catalogId){
    const existing = state.items.find(i=>i.catalogId===catalogId);
    if(existing){ existing.qty++; return; }
    const c=catItem(catalogId); if(!c) return;
    state.items.push({uid:Date.now()+Math.random(), catalogId, name:c.name, qty:1, checked:false});
  }else if(freeName && freeName.trim()){
    state.items.push({uid:Date.now()+Math.random(), catalogId:null, name:freeName.trim(), qty:1, checked:false});
  }
}
function addItem(catalogId, freeName){
  if(catalogId){
    const existing = state.items.find(i=>i.catalogId===catalogId);
    if(existing){ existing.qty++; toast("Quantité +1 : "+existing.name); }
    else{
      const c=catItem(catalogId);
      state.items.push({uid:Date.now()+Math.random(), catalogId, name:c.name, qty:1, checked:false});
      toast("Ajouté : "+c.name);
    }
  }else if(freeName && freeName.trim()){
    state.items.push({uid:Date.now()+Math.random(), catalogId:null, name:freeName.trim(), qty:1, checked:false});
    toast("Ajouté : "+freeName.trim());
  }
  saveState(); render();
}

/* ---- Autocomplete ---- */
const input=$("#addInput"), sug=$("#suggest");
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
/* Suggestions groupées par famille : taper "fromage" ne doit pas cracher
   22 lignes à plat mais les familles, avec le moins cher de chaque. */
input.addEventListener("input", ()=>{
  const q=norm(input.value);
  if(q.length<1){ sug.hidden=true; return; }
  const hits = DATA.catalog.filter(c=>norm(c.name).includes(q)||norm(famLabel(c.famille||"")).includes(q));
  if(hits.length===0){ sug.hidden=true; return; }

  const fams=new Map();
  for(const c of hits){
    const f=c.famille||c.id;
    if(!fams.has(f)) fams.set(f,[]);
    fams.get(f).push(c);
  }
  const rows=[...fams.entries()].map(([f,arr])=>{
    const sorted=arr.map(c=>({c,best:bestStoreFor(c,1)}))
                    .sort((a,b)=>(a.best?a.best.cost:Infinity)-(b.best?b.best.cost:Infinity));
    return {f, pick:sorted[0], n:arr.length};
  }).sort((a,b)=>(a.pick.best?a.pick.best.cost:Infinity)-(b.pick.best?b.pick.best.cost:Infinity))
    .slice(0,8);

  const shown=rows.reduce((a,r)=>a+r.n,0);
  sug.innerHTML = rows.map(r=>{
    const c=r.pick.c, best=r.pick.best;
    const more = r.n>1 ? ` <span class="muted small">· ${r.n} réf. en ${esc(famLabel(r.f))}</span>` : "";
    return `<button data-id="${esc(c.id)}">
      <span>${esc(c.name)} <span class="muted small">· ${esc(c.unit||"")}</span>${more}</span>
      <b>${best?fmt(best.cost):"—"}</b>
    </button>`;
  }).join("") + (hits.length>shown
    ? `<button data-cat="1"><span class="muted small">+ ${hits.length-shown} autre(s) — voir dans le catalogue</span><b>›</b></button>` : "");
  sug.hidden=false;
  sug.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    if(b.dataset.cat){
      catQuery=input.value; $("#catSearch").value=catQuery;
      input.value=""; sug.hidden=true; switchView("catalogue"); return;
    }
    addItem(b.dataset.id,null); input.value=""; sug.hidden=true; input.focus();
  });
});
input.addEventListener("keydown", e=>{
  if(e.key==="Enter"){ commitAdd(); }
});
document.addEventListener("click", e=>{ if(!e.target.closest(".addbar")) sug.hidden=true; });
$("#addBtn").onclick=commitAdd;
function commitAdd(){
  const q=norm(input.value);
  if(!q) return;
  const exact = DATA.catalog.find(c=>norm(c.name)===q) || DATA.catalog.filter(c=>norm(c.name).includes(q))[0];
  if(exact && norm(exact.name).includes(q)) addItem(exact.id,null);
  else addItem(null, input.value);
  input.value=""; sug.hidden=true;
}

/* ---- Comparateur ---- */
function renderCompare(){
  const body=$("#cmpBody");
  const items=enrichedItems();
  const {full, partial, free}=bucketItems(items);
  const priced=[...full, ...partial];
  if(items.length===0){
    body.innerHTML=`<div class="empty"><div class="big">${I.scale}</div><b>Rien à comparer</b><div class="small">Ajoute d'abord des articles à ta liste.</div></div>`;
    return;
  }
  const totals=storeTotals(full);
  let html="";
  if(full.length===0){
    html+=`<div class="card warn"><b>Comparaison impossible</b><div class="small">Aucun article de ta liste n'a ses prix relevés dans les trois enseignes. Les prix connus sont affichés ci-dessous, mais aucun total par enseigne ne serait honnête.</div></div>`;
  }else{
    html+=`<div class="totalsGrid">`;
    const min=Math.min(...DATA.stores.map(s=>totals[s.id].adj));
    for(const s of DATA.stores){
      const t=totals[s.id];
      html+=`<div class="tstore" style="background:${s.color}${t.adj<=min+0.001?"":"cc"}">
        <div class="tname">${esc(s.name)}${t.adj<=min+0.001?" ✓":""}</div>
        <div class="tval">${fmt(t.adj)}</div>
        ${t.missing.length?`<div class="tmiss">${t.missing.length} indispo.*</div>`:""}
      </div>`;
    }
    const anyMissing=DATA.stores.some(s=>totals[s.id].missing.length);
    html+=`</div><div class="small muted" style="margin:0 4px 10px">Total si tu achetais dans une seule enseigne, calculé sur les <b>${full.length} article(s) comparable(s)</b> — ceux dont le prix est connu (ou l'absence confirmée) dans les trois enseignes.${anyMissing?" * Articles indisponibles comptés au meilleur prix ailleurs.":""}</div>`;
  }
  if(partial.length){
    html+=`<div class="card warn"><b>${partial.length} article(s) hors comparaison</b>
      <div class="small">Il manque des relevés : ${esc(partial.map(p=>p.name).join(", "))}. Ils sont exclus des totaux ci-dessus pour ne pas fausser le classement, mais leurs prix connus restent affichés.</div></div>`;
  }

  for(const it of priced){
    const best=bestStoreFor(it.cat,it.qty);
    html+=`<div class="card cmp">
      <div class="cmpHead"><b>${esc(it.name)}</b><span class="qtyTag">${esc(it.cat.unit)} × ${it.qty}</span></div>
      ${freshnessTag(it.cat)}
      <div class="prow">`;
    for(const s of DATA.stores){
      const e=it.cat.prices[s.id];
      const st=priceState(e);
      const c=cost(e,it.qty);
      if(st===P_NA){
        html+=`<div class="pcell na"><div class="sname">${esc(s.name)}</div><div class="pval">—</div><div class="punit">indispo.</div></div>`;
      }else if(st===P_UNKNOWN){
        html+=`<div class="pcell todo"><div class="sname">${esc(s.name)}</div><div class="pval">?</div><div class="punit">à relever</div></div>`;
      }else{
        const isBest = best && Math.abs(c-best.cost)<0.001;
        const hasPromo=!!e.promo;
        html+=`<div class="pcell ${isBest?"best":""}">
          <div class="sname">${esc(s.name)}</div>
          <div class="pval">${hasPromo?`<span class="strike">${fmt(e.p*it.qty)}</span>`:""}${fmt(c)}</div>
          <div class="punit">${unitPriceLabel(it.cat, c, it.qty)}</div>
          ${hasPromo?`<span class="promoTag">${promoLabel(e.promo)}</span>`:""}
        </div>`;
      }
    }
    html+=`</div>`;
    html+=stepBox(it);
    const alts=alternativesFor(it);
    if(alts.length){
      html+=`<div class="altBox">`+alts.map(a=>{
        const e=a.c.prices[a.best.store.id];
        const p=e&&e.promo;
        const detail = a.up
          ? `${esc(a.c.unit)} · <b>${fmt(a.up.v)}/${UNIT_LABEL[a.up.u]}</b> chez ${esc(a.best.store.name)} <span class="altSave">−${Math.round(a.gain*100)}%</span> <span class="muted">(tu es à ${fmt(a.curUP.v)}/${UNIT_LABEL[a.curUP.u]})</span>`
          : `${fmt(a.best.cost)} chez ${esc(a.best.store.name)} <span class="altSave">−${fmt(a.save)}</span>`;
        return `<div class="alt"><span class="altTxt"><b>${esc(a.c.name)}</b> — ${detail}${p?` <span class="promoTag">${promoLabel(p)}</span>`:""}</span><button class="altBtn" data-swap="${it.uid}" data-to="${a.c.id}">Remplacer</button></div>`;
      }).join("")+`</div>`;
    }
    html+=`</div>`;
  }
  if(free.length){
    html+=`<div class="catTitle">Non comparés</div><div class="card small muted">${free.map(f=>esc(f.name)).join(", ")} — articles libres, sans correspondance dans le catalogue de prix.</div>`;
  }
  body.innerHTML=html;
  body.querySelectorAll("[data-swap]").forEach(b=>b.onclick=()=>swapItem(b.dataset.swap, b.dataset.to));
  body.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>setQty(b.dataset.step, +b.dataset.to));
}

/* ---- Paniers ---- */
function renderBaskets(){
  const body=$("#basketBody");
  const items=enrichedItems();
  if(items.filter(i=>i.cat).length===0){
    body.innerHTML=`<div class="empty"><div class="big">${I.bag}</div><b>Aucun panier à préparer</b><div class="small">Ajoute des articles comparables à ta liste.</div></div>`;
    return;
  }
  const {full}=bucketItems(items);
  const totals=storeTotals(full);            // classement : articles comparables uniquement
  const split=optimalSplit(items);           // panier pratique : tout ce qui a un prix connu
  const splitFull=optimalSplit(full);        // base honnête du calcul d'économie
  const ranked=[...DATA.stores].sort((a,b)=>totals[a.id].adj-totals[b.id].adj);
  const bestSingle=ranked[0];
  const saving=totals[bestSingle.id].adj-splitFull.total;

  let html=`<div class="toggle">
    <button class="${basketMode==="split"?"on":""}" data-mode="split">Répartition optimale</button>
    <button class="${basketMode==="single"?"on":""}" data-mode="single">Magasin unique</button>
  </div>`;

  if(basketMode==="split"){
    html+=`<div class="saveBox">
      <div class="small muted">Total optimisé (${DATA.stores.filter(s=>split.baskets[s.id].length).length} enseigne(s))</div>
      <div class="amt">${fmt(split.total)}</div>
      <div class="small">${full.length
        ? `dont <b>${fmt(Math.max(0,saving))}</b> d'économie vs tout acheter chez ${esc(bestSingle.name)}, calculé sur les ${full.length} article(s) comparable(s)`
        : `aucune économie chiffrable : aucun article n'a ses prix relevés dans les trois enseignes`}</div>
    </div>`;
    for(const s of DATA.stores){
      const arr=split.baskets[s.id];
      if(!arr.length) continue;
      const sub=arr.reduce((a,b)=>a+b.cost,0);
      html+=`<div class="card basket" style="border-left-color:${s.color}">
        <div class="bhead"><span class="bname" style="color:${s.color}">${esc(s.name)}</span><span class="btotal">${fmt(sub)}</span></div>
        ${arr.map(it=>`<div class="bline"><span class="n">${esc(it.name)} <span class="muted">× ${it.qty}</span>${isComparable(it.cat)?"":` <span class="pTag" title="Prix non relevés dans les autres enseignes">🔍</span>`}</span><span>${fmt(it.cost)}</span></div>`).join("")}
        <div class="bactions">
          <button data-copy="${s.id}">Copier la liste</button>
          <a href="${s.url}" target="_blank" rel="noopener">Ouvrir ${esc(s.name)} ↗</a>
        </div>
      </div>`;
    }
    if(split.unmatched.length){
      html+=`<div class="card small muted">Non répartis : ${split.unmatched.map(f=>esc(f.name)).join(", ")}</div>`;
    }
  }else if(full.length===0){
    html+=`<div class="card warn"><b>Classement impossible</b><div class="small">Aucun article de ta liste n'a ses prix relevés dans les trois enseignes — il n'y a rien à classer honnêtement. Passe en « Répartition optimale » pour voir les prix connus.</div></div>`;
  }else{
    html+=`<div class="small muted" style="margin:0 4px 10px">Classement si tu fais toutes tes courses dans une seule enseigne, sur les <b>${full.length} article(s) comparable(s)</b> :</div>`;
    ranked.forEach((s,i)=>{
      const t=totals[s.id];
      html+=`<div class="card rank">
        <div class="medal">${i+1}</div>
        <div class="rmain">
          <b style="color:${s.color}">${esc(s.name)}</b>
          ${t.missing.length?`<div class="small muted">Indisponible(s), compté(s) au meilleur prix ailleurs : ${t.missing.map(esc).join(", ")}</div>`:`<div class="small muted">Tous les articles disponibles</div>`}
        </div>
        <div class="rtotal">${fmt(t.adj)}</div>
      </div>`;
    });
    html+=`<div class="card small muted">Sur ces mêmes articles, la répartition optimale descend à <b>${fmt(splitFull.total)}</b>.</div>`;
  }
  body.innerHTML=html;
  body.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ basketMode=b.dataset.mode; renderBaskets(); });
  body.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copyBasket(b.dataset.copy));
}

function copyBasket(storeId){
  const split=optimalSplit(enrichedItems());
  const s=DATA.stores.find(x=>x.id===storeId);
  const arr=split.baskets[storeId];
  const txt=`Courses ${s.name} :\n`+arr.map(it=>`- ${it.name} × ${it.qty} (${fmt(it.cost)})`).join("\n")
    +`\nTotal : ${fmt(arr.reduce((a,b)=>a+b.cost,0))}`;
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(
    ()=>toast("Liste "+s.name+" copiée ✓"),
    ()=>toast("Copie impossible sur ce navigateur")
  );
}

/* ---- Source de données ----------------------------------------
   Priorité : 1) data/prix.csv (source de vérité, éditable dans Excel)
              2) /api/prices (fonction Netlify)
              3) données locales embarquées.
   CSV : séparateur ";", décimales "," ou ".",
   prix VIDE  = pas encore relevé (l'article sort des comparaisons),
   prix "x"   = produit indisponible dans cette enseigne (comparaison possible),
   promo = "-20%" | "1+1" | "2e-50", date_releve vide = prix simulé. */
function parseCSV(text){
  text = text.replace(/^\uFEFF/,"");
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return {catalog:[], lastDate:""};
  const head = lines[0].split(";").map(h=>h.trim().toLowerCase());
  const idx = {}; head.forEach((h,i)=>idx[h]=i);
  const num = v=>{
    v=(v||"").trim().replace(/€/g,"").replace(/\s/g,"").replace(",",".");
    if(!v) return null;
    const f=parseFloat(v); return isNaN(f)?null:f;
  };
  const promo = v=>{
    v=(v||"").trim().toLowerCase().replace(/\s/g,"");
    if(!v) return null;
    const m=v.match(/^-?(\d+)%$/); if(m) return {t:"pct",v:+m[1]};
    if(v==="1+1") return {t:"1+1"};
    if(v.startsWith("2e")||v.startsWith("2è")) return {t:"2e-50"};
    return null;
  };
  const catalog=[]; let lastDate="", nReleve=0;
  for(let i=1;i<lines.length;i++){
    const cells=lines[i].split(";");
    const g=n=>{const j=idx[n]; return j===undefined?"":(cells[j]||"").trim();};
    const name=g("nom"); if(!name) continue;
    const id=g("id")||norm(name).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
    const prices={};
    for(const s of ["delhaize","carrefour","colruyt"]){
      const raw=g("prix_"+s).toLowerCase();
      if(raw==="x"||raw==="-"||raw==="n/a"){ prices[s]={na:true}; continue; } // indispo. confirmée
      const p=num(raw);
      if(p===null){ prices[s]=null; continue; }                               // pas encore relevé
      const pr=promo(g("promo_"+s));
      prices[s]=pr?{p,promo:pr}:{p};
    }
    const d=g("date_releve");
    if(d){ nReleve++; if(d>lastDate) lastDate=d; }
    catalog.push({id, famille:g("famille")||id, name, unit:g("unite"),
      cat:g("categorie")||"📝 Autres", prices, releve:d||null});
  }
  return {catalog, lastDate, nReleve};
}
/* La provenance des données est une info d'analyste : elle s'affiche dans
   l'onglet Prix, plus dans l'en-tête. real : true = tout relevé, false =
   tout simulé, nombre = part relevée sur total. */
function setBadges(srcTxt, real, total){
  let etat;
  if(total===0) etat="aucun produit";
  else if(typeof real==="number" && total && real>0 && real<total) etat=`${real}/${total} relevés en magasin`;
  else etat = real ? "tous relevés en magasin" : "prix simulés";
  $("#dataInfo").textContent = `${total??"?"} produits · ${etat} · ${srcTxt}`;
}
async function loadData(){
  // 1) CSV statique
  try{
    const r=await fetch("data/prix.csv");
    if(r.ok){
      const d=parseCSV(await r.text());
      if(d.catalog.length){
        DATA={stores:LOCAL_DATA.stores, catalog:d.catalog};
        setBadges(d.lastDate?"CSV · dernier relevé "+frDate(d.lastDate):"CSV · simulé",
                  d.nReleve, d.catalog.length);
        render(); return;
      }
    }
  }catch(e){}
  // 2) Fonction Netlify
  try{
    const ctl=new AbortController();
    const to=setTimeout(()=>ctl.abort(),4000);
    const r=await fetch("/api/prices",{signal:ctl.signal});
    clearTimeout(to);
    if(r.ok){
      const d=await r.json();
      if(d && Array.isArray(d.catalog) && Array.isArray(d.stores)){
        DATA=d;
        setBadges("API"+(d.simulated?" · simulé":""), !d.simulated);
        render(); return;
      }
    }
  }catch(e){}
  // 3) Plus aucune source : mieux vaut le dire que d'inventer des prix
  setBadges("Aucune donnée de prix", false, DATA.catalog.length);
  render();
}

/* Petit parseur CSV générique pour stock.csv et suggestions.csv :
   même séparateur ";", mêmes règles (ligne vide ignorée, BOM toléré). */
function parseRows(text){
  const lines=text.replace(/^﻿/,"").split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return [];
  const head=lines[0].split(";").map(h=>h.trim().toLowerCase());
  return lines.slice(1).map(l=>{
    const c=l.split(";"); const o={};
    head.forEach((h,i)=>o[h]=(c[i]||"").trim());
    return o;
  });
}
async function loadStockCsv(){
  try{
    const r=await fetch("data/stock.csv");
    if(!r.ok) return;
    STOCK=parseRows(await r.text())
      .filter(o=>o.id && o.nom)
      .map(o=>({id:o.id, nom:o.nom, categorie:o.categorie||"📦 Divers",
                unite:o.unite||"pièce", seuil:parseFloat((o.seuil||"0").replace(",","."))||0,
                famille:o.famille||"", note:o.note||""}));
  }catch(e){}
}
async function loadSuggestions(){
  try{
    const r=await fetch("data/suggestions.csv");
    if(!r.ok) return;
    SUGGEST=parseRows(await r.text())
      .filter(o=>o.nom)
      .map(o=>({id:o.id||slugify(o.nom), nom:o.nom, raison:o.raison||"", date:o.date||""}));
  }catch(e){}
}
async function loadRefill(){
  try{
    const r=await fetch("data/refill.csv");
    if(!r.ok) return;
    REFILL=parseRows(await r.text())
      .filter(o=>o.batch && (o.poste||o.nom))
      .map(o=>({batch:o.batch, poste:o.poste||slugify(o.nom), nom:o.nom||"",
                delta:parseFloat((o.delta||"1").replace(",","."))||1, unite:o.unite||""}));
  }catch(e){}
}

loadState();
loadStock();
render();
loadData();
Promise.all([loadStockCsv(), loadSuggestions(), loadRefill()]).then(render);
if(syncEnabled()){ setSyncBadge("busy","Sync…"); syncNow(); }
else setSyncBadge("off","Sync off");
