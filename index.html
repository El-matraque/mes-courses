<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a7c56">
<title>Mes Courses — comparateur Delhaize · Carrefour · Colruyt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ==================================================================
     Habillage v2 — même DOM, mêmes classes, zéro logique modifiée.
     Typo Outfit, palette émeraude, cartes ombrées, micro-animations.
     ================================================================== */
  :root{
    --bg:#eef3ef; --card:#ffffff; --ink:#1b2a22; --muted:#66786d;
    --accent:#0e9f6e; --accent-deep:#0a7c56; --accent-soft:#e2f5ec; --accent-ring:#b5e5d2;
    --line:#e2eae4;
    --danger:#dc2626; --danger-soft:#fdecec;
    --promo:#b45309; --promo-bg:#fdf3d8;
    --info-bg:#eef4fd; --info-line:#cfe0f6;
    --radius:18px; --radius-s:12px; --nav-h:66px;
    --shadow:0 1px 2px rgba(20,35,27,.05), 0 10px 28px -16px rgba(20,35,27,.22);
    --shadow-lift:0 2px 6px rgba(20,35,27,.07), 0 18px 40px -18px rgba(20,35,27,.28);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.45;
    padding-bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));
  }
  button{font-family:inherit}
  button:active{transform:scale(.97)}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

  /* ---------------- En-tête ---------------- */
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(130deg,#10b077 0%, #0a7c56 70%, #096c4c 100%);
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    box-shadow:0 6px 24px -12px rgba(9,108,76,.55);
  }
  .hrow{display:flex; align-items:center; justify-content:space-between; gap:8px; max-width:640px; margin:0 auto}
  h1{font-size:19px; margin:0; font-weight:800; letter-spacing:-.02em; color:#fff; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,.12)}
  .badges{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
  .badge{
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap;
    background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(6px);
  }
  .badge.demo{background:rgba(255,214,102,.28); border-color:rgba(255,224,130,.5)}
  .badge.demo.real{background:rgba(255,255,255,.2); border-color:rgba(255,255,255,.32)}
  .badge.src{opacity:.85; font-weight:600}
  .badge.sync{border:1px solid rgba(255,255,255,.25); cursor:pointer; font-family:inherit}
  .badge.sync.off{background:rgba(0,0,0,.18); opacity:.9}
  .badge.sync.ok{background:rgba(255,255,255,.24)}
  .badge.sync.err{background:#e02424; border-color:#f98080}
  .badge.sync.busy{background:rgba(255,214,102,.35)}

  main{max-width:640px; margin:0 auto; padding:16px 14px 24px}
  @keyframes rise{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  main section{animation:rise .26s ease both}
  @media (prefers-reduced-motion: reduce){ main section{animation:none} button:active{transform:none} }
  section[hidden]{display:none}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .empty{text-align:center; padding:44px 18px; color:var(--muted)}
  .empty .big{font-size:52px; margin-bottom:12px; filter:drop-shadow(0 6px 12px rgba(20,35,27,.12))}
  .empty b{color:var(--ink); font-size:17px}
  code{background:var(--accent-soft); color:var(--accent-deep); padding:1px 5px; border-radius:6px; font-size:.9em}

  /* ---------------- Ajout rapide ---------------- */
  .addbar{position:relative; margin-bottom:14px}
  .addrow{display:flex; gap:8px}
  .addrow input{
    flex:1; font-size:16px; font-family:inherit; padding:13px 16px; border:1.5px solid var(--line);
    border-radius:999px; background:var(--card); color:var(--ink); outline:none;
    box-shadow:var(--shadow); transition:border-color .15s;
  }
  .addrow input::placeholder{color:#9aab9f}
  .addrow input:focus{border-color:var(--accent)}
  .addrow button{
    background:linear-gradient(135deg,#12b77c,#0a7c56); color:#fff; border:none; border-radius:999px;
    font-size:24px; width:50px; flex:0 0 50px; cursor:pointer; font-weight:700;
    box-shadow:0 6px 16px -6px rgba(10,124,86,.55);
  }
  .suggest{
    position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:15;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow-lift); overflow:hidden; max-height:300px; overflow-y:auto;
  }
  .suggest button{
    display:flex; width:100%; justify-content:space-between; align-items:center; gap:8px;
    background:none; border:none; border-bottom:1px solid var(--line);
    padding:12px 15px; font-size:15px; text-align:left; cursor:pointer; color:var(--ink);
  }
  .suggest button:last-child{border-bottom:none}
  .suggest button:active{background:var(--accent-soft)}
  .suggest b{font-variant-numeric:tabular-nums}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; justify-content:center}
  .chip{
    background:var(--card); border:1.5px solid var(--line); border-radius:999px;
    padding:9px 15px; font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink);
    box-shadow:var(--shadow);
  }
  .chip:active{background:var(--accent-soft); border-color:var(--accent)}

  /* ---------------- Liste ---------------- */
  .catTitle{
    font-size:12px; font-weight:800; color:var(--muted); margin:20px 6px 8px;
    text-transform:uppercase; letter-spacing:.08em;
  }
  .item{
    display:flex; align-items:center; gap:12px; background:var(--card);
    border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:9px;
    box-shadow:var(--shadow); transition:opacity .2s;
  }
  .item.checked{opacity:.62}
  .item.checked .iname{text-decoration:line-through; color:var(--muted)}
  .ck{
    width:27px; height:27px; flex:0 0 27px; border:2px solid #c6d4ca; border-radius:999px;
    background:var(--card); cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:14px; color:#fff; padding:0; transition:background .15s, border-color .15s;
  }
  .item.checked .ck{background:var(--accent); border-color:var(--accent)}
  .imain{flex:1; min-width:0}
  .iname{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .isub{font-size:12.5px; color:var(--muted); margin-top:1px}
  .qty{display:flex; align-items:center; gap:3px}
  .qty button{
    width:32px; height:32px; border-radius:999px; border:1.5px solid var(--line);
    background:var(--bg); font-size:17px; cursor:pointer; color:var(--ink); line-height:1; font-weight:600;
  }
  .qty span{min-width:26px; text-align:center; font-weight:800; font-variant-numeric:tabular-nums}
  .del{background:none; border:none; color:#b0bfb5; font-size:17px; cursor:pointer; padding:6px}

  /* ---------------- Comparateur ---------------- */
  .totalsGrid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:12px}
  .tstore{border-radius:var(--radius-s); padding:12px 8px; text-align:center; color:#fff; box-shadow:var(--shadow)}
  .tstore .tname{font-size:12px; font-weight:800; opacity:.95}
  .tstore .tval{font-size:18px; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums}
  .tstore .tmiss{font-size:10.5px; opacity:.9; margin-top:2px}
  .cmp{margin-bottom:12px}
  .cmpHead{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:8px}
  .cmpHead b{font-size:15.5px}
  .cmpHead .qtyTag{font-size:12px; color:var(--muted); white-space:nowrap; font-weight:600}
  .prow{display:grid; grid-template-columns:repeat(3,1fr); gap:7px}
  .pcell{
    border:1.5px solid var(--line); border-radius:var(--radius-s); padding:9px 6px; text-align:center;
    background:#fafcfa;
  }
  .pcell .sname{font-size:11px; font-weight:800; color:var(--muted)}
  .pcell .pval{font-size:15px; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums}
  .pcell .punit{font-size:10.5px; color:var(--muted)}
  .pcell.best{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 3px var(--accent-ring) inset}
  .pcell.best .pval{color:var(--accent-deep)}
  .pcell.na{opacity:.42}
  .pcell.todo{border-style:dashed; border-color:#c3d1c8; background:#f6f9f7}
  .pcell.todo .pval{color:var(--muted); font-weight:700}
  .card.warn{background:#fffaf0; border-color:#f3dfae}
  .fresh{font-size:11px; font-weight:700; margin:-2px 0 8px; color:var(--muted)}
  .fresh.ok{color:var(--accent-deep)}
  .fresh.mid{color:var(--promo)}
  .fresh.old{color:var(--danger)}
  .fresh.sim{color:var(--promo)}
  .promoTag{
    display:inline-block; background:var(--promo-bg); color:var(--promo);
    font-size:10px; font-weight:800; border-radius:6px; padding:2px 6px; margin-top:3px;
  }
  .strike{text-decoration:line-through; color:var(--muted); font-weight:500; font-size:11px; margin-right:3px}
  .pTag{font-size:11px; opacity:.7}

  .altBox{margin-top:10px; border-top:1.5px dashed var(--line); padding-top:10px; display:flex; flex-direction:column; gap:7px}
  .alt{display:flex; align-items:center; gap:7px; font-size:12.5px; flex-wrap:wrap}
  .alt .altTxt{flex:1; min-width:180px}
  .altSave{color:var(--accent-deep); font-weight:800}
  .altBtn{
    background:var(--accent); color:#fff; border:none; border-radius:999px;
    padding:6px 13px; font-size:12px; font-weight:700; cursor:pointer;
    box-shadow:0 4px 10px -4px rgba(10,124,86,.5);
  }

  /* ---------------- Palier promo ---------------- */
  .step{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:var(--promo-bg); border:1px solid #f0dcA5; border-radius:var(--radius-s);
    padding:10px 12px; margin-top:8px; font-size:12.5px; color:#8a5a08;
  }
  .step .stepTxt{flex:1; min-width:170px}
  .item + .step{margin-top:-3px; margin-bottom:10px}
  .stepBtn{
    background:var(--promo); color:#fff; border:none; border-radius:999px;
    padding:6px 13px; font-size:12px; font-weight:700; cursor:pointer;
  }

  /* ---------------- Paniers ---------------- */
  .toggle{display:flex; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px; margin-bottom:14px; box-shadow:var(--shadow)}
  .toggle button{
    flex:1; border:none; background:none; padding:10px 6px; border-radius:999px;
    font-size:13.5px; font-weight:700; color:var(--muted); cursor:pointer; transition:background .15s,color .15s;
  }
  .toggle button.on{background:var(--accent); color:#fff; box-shadow:0 4px 10px -4px rgba(10,124,86,.5)}
  .basket{border-left:5px solid var(--line)}
  .bhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px}
  .bhead .bname{font-weight:800; font-size:16px}
  .bhead .btotal{font-weight:800; font-size:16px; font-variant-numeric:tabular-nums}
  .bline{display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); font-size:14px}
  .bline:last-of-type{border-bottom:none}
  .bline .n{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .bline span:last-child{font-variant-numeric:tabular-nums}
  .bactions{display:flex; gap:8px; margin-top:12px}
  .bactions button, .bactions a{
    flex:1; text-align:center; padding:11px 8px; border-radius:999px; font-size:13px; font-weight:700;
    border:1.5px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; text-decoration:none;
  }
  .saveBox{
    background:linear-gradient(135deg,#e6f8ef,#d5f2e4); border:1px solid var(--accent-ring);
    border-radius:var(--radius); padding:16px; margin-bottom:14px; text-align:center; box-shadow:var(--shadow);
  }
  .saveBox .amt{font-size:26px; font-weight:800; color:var(--accent-deep); font-variant-numeric:tabular-nums}
  .rank{display:flex; align-items:center; gap:12px}
  .rank .rmain{flex:1}
  .rank .rtotal{font-weight:800; font-size:17px; font-variant-numeric:tabular-nums}

  /* ---------------- Catalogue ---------------- */
  .ray{margin-bottom:9px}
  .rayHead{
    display:flex; width:100%; justify-content:space-between; align-items:center; gap:8px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; font-size:15px; font-weight:700; color:var(--ink); cursor:pointer; text-align:left;
    box-shadow:var(--shadow);
  }
  .rayHead:active{background:var(--accent-soft)}
  .rayN{font-size:12.5px; font-weight:800; color:var(--muted); display:flex; align-items:center; gap:8px}
  .chev{font-size:11px; color:var(--accent)}
  .rayBody{padding:8px 0 2px}
  .famHead{
    font-size:11.5px; font-weight:800; color:var(--muted); text-transform:uppercase;
    letter-spacing:.07em; margin:12px 8px 6px;
  }
  .prod{
    display:flex; align-items:center; gap:10px; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:7px;
    box-shadow:var(--shadow);
  }
  .pmain{flex:1; min-width:0}
  .pname{font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .psub{font-size:12px; color:var(--muted); margin-top:1px}
  .psub b{font-variant-numeric:tabular-nums}
  .addP{
    width:38px; height:38px; flex:0 0 38px; border-radius:999px; border:1.5px solid var(--accent-ring);
    background:var(--accent-soft); font-size:20px; font-weight:700; color:var(--accent-deep); cursor:pointer; line-height:1;
  }
  .addP.in{background:var(--accent); border-color:var(--accent); color:#fff; font-size:15px}

  /* ---------------- Inventaire ---------------- */
  .stkTools{display:flex; gap:9px; margin-bottom:14px}
  .stkTools button{
    flex:1; padding:13px 8px; border-radius:999px; border:1.5px solid var(--line);
    background:var(--card); color:var(--ink); font-size:13.5px; font-weight:700; cursor:pointer;
    box-shadow:var(--shadow);
  }
  .primaryBtn{
    background:linear-gradient(135deg,#12b77c,#0a7c56) !important; border-color:transparent !important;
    color:#fff !important; box-shadow:0 6px 16px -6px rgba(10,124,86,.55) !important;
  }
  .stk{
    display:flex; align-items:center; gap:12px; background:var(--card);
    border:1px solid var(--line); border-left:5px solid var(--line);
    border-radius:var(--radius); padding:12px 14px; margin-bottom:9px; box-shadow:var(--shadow);
  }
  .stk.ok{border-left-color:var(--accent)}
  .stk.bas{border-left-color:var(--promo)}
  .stk.vide{border-left-color:var(--danger)}
  .stkMain{flex:1; min-width:0}
  .stkName{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .stkBar{height:6px; border-radius:99px; background:#e8efe9; margin:7px 0 6px; overflow:hidden}
  .stkBar span{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#12b77c,#0a9d68); transition:width .3s ease}
  .stk.bas .stkBar span{background:linear-gradient(90deg,#f59e0b,#d97706)}
  .stk.vide .stkBar span{background:linear-gradient(90deg,#f87171,#dc2626)}
  .stkSub{font-size:12px; color:var(--muted)}
  .stkSub b{font-variant-numeric:tabular-nums}
  .linkBtn{background:none; border:none; color:var(--accent-deep); font-size:12px; font-weight:800; cursor:pointer; padding:0 0 0 5px}
  .posteForm label{display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin:10px 0 0}
  .posteForm input{
    display:block; width:100%; margin-top:4px; font-size:16px; font-family:inherit; padding:11px 13px;
    border:1.5px solid var(--line); border-radius:var(--radius-s); background:var(--bg); color:var(--ink);
  }
  .posteForm input:focus{border-color:var(--accent); outline:none}
  .exportTa{
    width:100%; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px;
    border:1.5px solid var(--line); border-radius:var(--radius-s); padding:10px; background:var(--bg); color:var(--ink);
  }
  .refillCard{background:linear-gradient(135deg,#eafaf1,#ddf4e7); border-color:var(--accent-ring)}

  /* ---------------- Suggestions de Claude ---------------- */
  .sugCard{background:var(--info-bg); border-color:var(--info-line)}
  .sugRow{display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px dashed var(--info-line)}
  .sugRow:last-of-type{border-bottom:none}
  .sugTxt{flex:1; min-width:0; font-size:13.5px}
  .sugAdd,.sugNo{
    width:32px; height:32px; flex:0 0 32px; border-radius:999px; border:1.5px solid var(--line);
    background:var(--card); font-size:16px; font-weight:700; cursor:pointer; line-height:1;
  }
  .sugAdd{color:var(--accent-deep); border-color:var(--accent-ring); background:var(--accent-soft)}
  .sugNo{color:var(--muted)}

  /* ---------------- Promos ---------------- */
  .promoCard{border-left:5px solid var(--line)}
  .promoCard.deal{border-left-color:var(--accent)}
  .promoCard.trap{border-left-color:var(--danger); opacity:.92}
  .promoCard.unknown{border-left-color:#c3d1c8}
  .promoRow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:2px 0 9px}
  .pStore{font-size:12.5px; font-weight:800}
  .pPrice{margin-left:auto; font-size:15px; font-variant-numeric:tabular-nums}
  .pPrice b{font-size:17px}
  .vLine{font-size:12.5px; font-weight:700; padding:8px 10px; border-radius:10px; margin-bottom:7px}
  .vLine.good{background:var(--accent-soft); color:var(--accent-deep)}
  .vLine.bad{background:var(--danger-soft); color:var(--danger)}
  .vLine.unk{background:#eef2ef; color:var(--muted)}
  .vLine.warnLine{background:var(--promo-bg); color:var(--promo)}
  .promoCard .bactions{margin-top:10px}

  /* ---------------- Scanner ---------------- */
  .scanWrap{position:fixed; inset:0; z-index:60; background:#000; display:flex; flex-direction:column}
  .scanHead{
    display:flex; align-items:center; gap:10px; padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    color:#fff; font-weight:800; font-size:15px; background:#0c1410;
  }
  .scanHead button{margin-left:auto; background:rgba(255,255,255,.12); border:none; color:#fff; font-size:18px; cursor:pointer; width:36px; height:36px; border-radius:999px}
  #scanView{flex:1; min-height:0; overflow:hidden}
  #scanView video{width:100%; height:100%; object-fit:cover}
  .scanFoot{background:#0c1410; color:#fff; padding:14px 16px calc(14px + env(safe-area-inset-bottom)); font-size:13px}
  .scanFoot .manual{display:flex; gap:8px; margin-top:10px}
  .scanFoot input{
    flex:1; font-size:16px; font-family:inherit; padding:11px 14px; border-radius:999px; border:1.5px solid #2b3a32;
    background:#16211b; color:#fff;
  }
  .scanFoot .manual button{
    padding:11px 18px; border-radius:999px; border:none; background:var(--accent);
    color:#fff; font-weight:700; cursor:pointer;
  }
  .scanMsg{opacity:.9; font-weight:600}
  .scanMsg.err{color:#fca5a5}
  .scanActions{display:flex; gap:8px; margin-top:10px}
  .scanActions button{
    flex:1; padding:10px 10px; border-radius:999px; border:1px solid #2b3a32;
    background:#16211b; color:#fff; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .stapleOpt{
    border:1px solid #2b3a32; border-radius:var(--radius-s); background:#16211b; color:#fff;
    padding:11px 13px; font-size:14px; font-weight:600; cursor:pointer; text-align:left;
  }

  /* ---------------- Navigation ---------------- */
  nav{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:rgba(255,255,255,.94); backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    box-shadow:0 -8px 24px -18px rgba(20,35,27,.35);
    display:flex; height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding:6px 4px calc(env(safe-area-inset-bottom) + 4px);
  }
  nav button{
    flex:1; min-width:0; background:none; border:none; cursor:pointer; color:#8fa096;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   DONNÉES — actuellement SIMULÉES.
   Au chargement, l'app tente d'abord GET /api/prices (fonction Netlify,
   voir netlify/functions/prices.mjs). Si indisponible, elle utilise le
   jeu de données local ci-dessous. Pour brancher de vraies données
   (scraping, API tierce type Apify/Pepesto), il suffit que /api/prices
   renvoie le même format : { stores:[...], catalog:[...] }.
   ===================================================================== */

const LOCAL_DATA = {
  stores: [
    {"id": "delhaize", "name": "Delhaize", "color": "#CE1126", "url": "https://www.delhaize.be"},
    {"id": "carrefour", "name": "Carrefour", "color": "#004E9F", "url": "https://www.carrefour.be"},
    {"id": "colruyt", "name": "Colruyt", "color": "#F07D00", "url": "https://www.colruyt.be"}
  ],
  /* prices: { <storeId>: ... } — trois états possibles, à ne pas confondre :
       {p:prix, promo?:{t:'pct'|'1+1'|'2e-50', v?:%}}  → prix connu
       {na:true}                                        → produit indisponible dans cette enseigne
       null / absent                                    → prix PAS ENCORE RELEVÉ (inconnu)
     La distinction est essentielle : un prix inconnu ne doit jamais être traité
     comme une absence de produit, sinon les totaux par enseigne mentent.
     famille : produits similaires (alternatives). releve : date du relevé réel, null = simulé. */
  catalog: [
    /* Volontairement VIDE : ce fallback contenait 45 produits génériques aux
       prix inventés ("Bière blonde", "Yaourt nature"…). Ils ont été purgés —
       un faux prix sous un faux nom est pire que pas de donnée du tout.
       La source de vérité est data/prix.csv ; si ce fichier ne se charge pas,
       l'app le dit franchement plutôt que d'afficher du simulé. */
  ]
};

/* ============================ ÉTAT ============================ */
let DATA = LOCAL_DATA;
let state = { items: [] }; // {uid, catalogId|null, name, qty, checked}
let view = "liste";
let basketMode = "split"; // 'split' | 'single'

const LS_KEY = "mes-courses-v1";
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  if(typeof scheduleSync==="function") scheduleSync();
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const s = JSON.parse(raw); if(s && Array.isArray(s.items)) state = s; }
  }catch(e){}
}

/* ==================== INVENTAIRE (modèle hybride) ====================
   Deux moitiés, volontairement séparées :

   • data/stock.csv — LES SEUILS, ce qu'on doit toujours avoir en réserve.
     Versionné dans le repo, donc lisible et modifiable hors de l'app.
     Ça change rarement.

   • localStorage    — LES QUANTITÉS DU MOMENT, plus la mémoire des
     codes-barres déjà rattachés à un poste. Ça change tous les jours et
     doit rester instantané, y compris debout devant un placard.

   Le bouton « Exporter » sert de pont : il recrache l'état complet en CSV,
   à recoller dans data/stock.csv quand on veut le figer dans le repo. */
let STOCK = [];                       // postes venant de data/stock.csv
let SUGGEST = [];                     // propositions venant de data/suggestions.csv
let REFILL = [];                      // réassorts venant de data/refill.csv (tickets lus par Claude)
const SK_KEY = "mes-courses-stock-v1";
let stock = { qty:{}, seuil:{}, custom:[], ean:{}, dismissed:[], refillsDone:[] };
function saveStock(){
  try{ localStorage.setItem(SK_KEY, JSON.stringify(stock)); }catch(e){}
  if(typeof scheduleSync==="function") scheduleSync();
}
function loadStock(){
  try{
    const raw = localStorage.getItem(SK_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && typeof s === "object")
        stock = {qty:s.qty||{}, seuil:s.seuil||{}, custom:s.custom||[],
                 ean:s.ean||{}, dismissed:s.dismissed||[], refillsDone:s.refillsDone||[]};
    }
  }catch(e){}
}
/* Postes = ceux du CSV + ceux créés dans l'app, avec les seuils éventuellement
   redéfinis localement (le local gagne : c'est le plus récent). */
function stockItems(){
  const all=[...STOCK, ...stock.custom];
  return all.map(p=>({
    ...p,
    seuil: stock.seuil[p.id] !== undefined ? stock.seuil[p.id] : p.seuil,
    qty:   stock.qty[p.id]   !== undefined ? stock.qty[p.id]   : 0,
  }));
}
function stockItem(id){ return stockItems().find(p=>p.id===id) || null; }
/* Manquants = sous le seuil. On renvoie aussi combien il en faut. */
function missingStock(){
  return stockItems()
    .filter(p=>p.seuil>0 && p.qty < p.seuil)
    .map(p=>({...p, manque: Math.round((p.seuil-p.qty)*100)/100}))
    .sort((a,b)=>(a.qty/a.seuil)-(b.qty/b.seuil));   // les plus critiques d'abord
}
function setStockQty(id, q){
  stock.qty[id]=Math.max(0, Math.round(q*100)/100);
  saveStock(); render();
}
function slugify(s){
  return norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40);
}

/* ==================== SYNCHRO ENTRE APPAREILS ====================
   La liste et le stock vivaient dans le navigateur de CHAQUE appareil :
   l'iPhone et le PC avaient chacun leur copie. La synchro les fait
   converger vers un document unique stocké côté serveur (/api/sync,
   Netlify Blobs), protégé par un mot de passe partagé du foyer.

   Principe : fusion à TROIS états. On garde une copie du dernier état
   synchronisé (la "base"). À chaque synchro : pour chaque élément,
   si la valeur locale n'a pas bougé depuis la base, la version serveur
   gagne (l'autre appareil a agi) ; si elle a bougé, le local gagne
   (c'est nous qui avons agi). Ainsi "elle ajoute du pain sur son
   téléphone pendant que je coche le lait sur le mien" conserve les deux.

   Sans mot de passe enregistré, l'app reste 100 % locale, comme avant. */
const SY_PW_KEY="mes-courses-sync-pw", SY_BASE_KEY="mes-courses-sync-base";
let syncTimer=null, syncBusy=false, syncApplying=false, syncState="off"; // off | ok | err | busy

function syncPw(){ try{ return localStorage.getItem(SY_PW_KEY)||""; }catch(e){ return ""; } }
function syncEnabled(){ return !!syncPw(); }
function localDoc(){
  return { items: state.items,
           stock: { qty:stock.qty, seuil:stock.seuil, custom:stock.custom,
                    ean:stock.ean, dismissed:stock.dismissed, refillsDone:stock.refillsDone } };
}
function applyDoc(d){
  if(!d) return;
  /* syncApplying empêche la sauvegarde déclenchée ICI de programmer une
     nouvelle synchro : sans ce verrou, chaque passe en planifierait une
     autre 3 s plus tard, indéfiniment. */
  syncApplying=true;
  try{
    if(Array.isArray(d.items)) state.items=d.items;
    if(d.stock && typeof d.stock==="object"){
      stock={ qty:d.stock.qty||{}, seuil:d.stock.seuil||{}, custom:d.stock.custom||[],
              ean:d.stock.ean||{}, dismissed:d.stock.dismissed||[], refillsDone:d.stock.refillsDone||[] };
    }
    saveState(); saveStock();
  }finally{ syncApplying=false; }
}
function syncBase(){
  try{ const r=localStorage.getItem(SY_BASE_KEY); return r?JSON.parse(r):null; }catch(e){ return null; }
}
function setSyncBase(doc){ try{ localStorage.setItem(SY_BASE_KEY, JSON.stringify(doc)); }catch(e){} }
const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);

/* Fusion par clé : local modifié depuis la base → local gagne, sinon serveur.
   undefined = absent (création/suppression traitées par la même règle). */
function mergeKey(srv, loc, bas){
  return eq(loc,bas) ? srv : loc;
}
function mergeById(srvArr, locArr, basArr, keyOf){
  const S=new Map((srvArr||[]).map(x=>[keyOf(x),x]));
  const L=new Map((locArr||[]).map(x=>[keyOf(x),x]));
  const B=new Map((basArr||[]).map(x=>[keyOf(x),x]));
  const ids=[...new Set([...S.keys(),...L.keys(),...B.keys()])];
  const out=[];
  for(const id of ids){
    const m=mergeKey(S.get(id), L.get(id), B.get(id));
    if(m!==undefined) out.push(m);
  }
  return out;
}
function mergeMap(srv, loc, bas){
  const out={};
  const keys=[...new Set([...Object.keys(srv||{}),...Object.keys(loc||{}),...Object.keys(bas||{})])];
  for(const k of keys){
    const m=mergeKey((srv||{})[k],(loc||{})[k],(bas||{})[k]);
    if(m!==undefined) out[k]=m;
  }
  return out;
}
function mergeDocs(srv, loc, bas){
  srv=srv||{items:[],stock:{}}; loc=loc||{items:[],stock:{}}; bas=bas||{items:[],stock:{}};
  const ss=srv.stock||{}, ls=loc.stock||{}, bs=bas.stock||{};
  return {
    items: mergeById(srv.items, loc.items, bas.items, x=>String(x.uid)),
    stock: {
      qty:   mergeMap(ss.qty, ls.qty, bs.qty),
      seuil: mergeMap(ss.seuil, ls.seuil, bs.seuil),
      ean:   mergeMap(ss.ean, ls.ean, bs.ean),
      custom: mergeById(ss.custom, ls.custom, bs.custom, x=>x.id),
      /* listes à sens unique (on n'y fait qu'ajouter) : union */
      dismissed:  [...new Set([...(ss.dismissed||[]),...(ls.dismissed||[])])],
      refillsDone:[...new Set([...(ss.refillsDone||[]),...(ls.refillsDone||[])])],
    }
  };
}

function setSyncBadge(st, label){
  syncState=st;
  const b=$("#syncBadge"); if(!b) return;
  b.className="badge sync "+st;
  b.textContent=label;
}
async function syncApi(method, body){
  const ctl=new AbortController();
  const to=setTimeout(()=>ctl.abort(), 10000);
  try{
    const r=await fetch("/api/sync",{ method, signal:ctl.signal,
      headers:{ "x-sync-password":syncPw(), ...(body?{"content-type":"application/json"}:{}) },
      body: body?JSON.stringify(body):undefined });
    clearTimeout(to);
    return { status:r.status, json: await r.json().catch(()=>null) };
  }catch(e){ clearTimeout(to); return { status:0, json:null }; }
}
/* Une passe complète : pull → fusion → apply → push si besoin.
   Réentrance bloquée ; les modifications pendant la passe repartiront
   au prochain scheduleSync. */
async function syncNow(){
  if(!syncEnabled() || syncBusy) return;
  syncBusy=true;
  setSyncBadge("busy","Sync…");
  try{
    const g=await syncApi("GET");
    if(g.status===401){ setSyncBadge("err","Sync ! mdp"); return; }
    if(g.status===503){ setSyncBadge("err","Sync ! config"); return; }
    if(g.status!==200 || !g.json){ setSyncBadge("err","Sync ! réseau"); return; }
    let version=g.json.version||0;
    const merged=mergeDocs(g.json.doc, localDoc(), syncBase());
    applyDoc(merged);
    if(!eq(merged, g.json.doc)){
      let p=await syncApi("PUT",{baseVersion:version, doc:merged});
      if(p.status===409 && p.json && p.json.current){
        /* l'autre appareil a poussé pendant notre passe : on refusionne
           sur son état et on retente UNE fois */
        const re=mergeDocs(p.json.current.doc, localDoc(), syncBase());
        applyDoc(re);
        p=await syncApi("PUT",{baseVersion:p.json.current.version, doc:re});
      }
      if(p.status!==200){ setSyncBadge("err","Sync !"); return; }
      version=p.json.version;
    }
    setSyncBase(localDoc());
    const t=new Date();
    setSyncBadge("ok",`Sync ✓ ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`);
    render();
  }finally{
    syncBusy=false;
  }
}
function scheduleSync(){
  if(!syncEnabled() || syncApplying) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(syncNow, 3000);   // laisse finir une rafale de modifications
}
function syncSetup(){
  const cur=syncPw();
  const pw=window.prompt(cur
    ? "Mot de passe de synchro (laisser vide pour désactiver la synchro sur cet appareil) :"
    : "Mot de passe de synchro du foyer (le même sur chaque appareil) :", cur);
  if(pw===null) return;                 // annulé
  try{
    if(pw.trim()===""){
      localStorage.removeItem(SY_PW_KEY); localStorage.removeItem(SY_BASE_KEY);
      setSyncBadge("off","Sync off");
      toast("Synchro désactivée sur cet appareil");
    }else{
      localStorage.setItem(SY_PW_KEY, pw.trim());
      toast("Connexion…");
      syncNow();
    }
  }catch(e){ toast("Stockage local indisponible"); }
}

/* ---- Réassort depuis un ticket de caisse ----------------------------
   Enzo photographie son ticket, Claude le lit et écrit une ligne par
   article dans data/refill.csv (batch;poste;nom;delta;unite). L'app
   regroupe par batch (= un ticket) et propose d'appliquer en UN tap :
   chaque delta s'ajoute à la quantité du poste. Un batch appliqué ou
   ignoré est mémorisé localement (refillsDone) pour ne jamais compter
   deux fois le même ticket — c'est le pendant "stock" des suggestions. */
function pendingRefills(){
  const byBatch=new Map();
  for(const r of REFILL){
    if(stock.refillsDone.includes(r.batch)) continue;
    if(!byBatch.has(r.batch)) byBatch.set(r.batch,[]);
    byBatch.get(r.batch).push(r);
  }
  return byBatch;
}
function applyRefill(batch){
  const rows=REFILL.filter(r=>r.batch===batch);
  let added=0;
  for(const r of rows){
    let p=stockItem(r.poste);
    if(!p && r.nom){
      const id=r.poste||slugify(r.nom);
      /* catégorie devinée depuis le catalogue quand il connaît le produit */
      const m=DATA.catalog.find(c=>{const cn=norm(c.name),rn=norm(r.nom);return cn&&(rn.includes(cn)||cn.includes(rn));});
      stock.custom.push({id, nom:r.nom, categorie:(m&&m.cat)||"📦 Divers",
                         unite:r.unite||"pièce", seuil:0, famille:(m&&m.famille)||"", note:"ajouté depuis un ticket"});
      added++;
    }
  }
  stock.refillsDone.push(batch);
  saveStock(); render();
  toast(added ? `${added} produit(s) ajoutés à votre base` : "Produits déjà dans votre base");
}

}

const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString("fr-BE",{style:"currency",currency:"EUR"});
const stripEmoji = s => String(s).replace(/[\u{1F000}-\u{1FBFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu,"").replace(/^\s+/,"");
const esc = s => stripEmoji(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const catItem = id => DATA.catalog.find(c=>c.id===id) || null;

/* ================== LOGIQUE PRIX & PROMOS ==================== */
/* Trois états de prix, jamais à confondre :
     "ok"      → prix connu, comparable
     "na"      → produit indisponible dans cette enseigne
     "unknown" → prix pas encore relevé
   Un article dont un seul prix est "unknown" n'est PAS comparable :
   l'inclure dans les totaux ferait ressortir les enseignes à égalité. */
const P_OK="ok", P_NA="na", P_UNKNOWN="unknown";
function priceState(entry){
  if(!entry) return P_UNKNOWN;
  if(entry.na) return P_NA;
  return typeof entry.p === "number" ? P_OK : P_UNKNOWN;
}
/* Un article est comparable si aucune enseigne n'a de prix inconnu. */
function isComparable(cat){
  return !!cat && DATA.stores.every(s=>priceState(cat.prices[s.id])!==P_UNKNOWN);
}
/* Enseignes dont le prix reste à relever pour cet article */
function unknownStores(cat){
  return DATA.stores.filter(s=>priceState(cat.prices[s.id])===P_UNKNOWN);
}
/* Coût total pour q unités selon la promo. Exporté à l'identique
   dans tests/logic.test.mjs — garder les deux synchronisés. */
function cost(entry, q){
  if(priceState(entry)!==P_OK) return null;
  const p = entry.p, promo = entry.promo;
  if(!promo) return p*q;
  if(promo.t==="pct")   return p*(1-promo.v/100)*q;
  if(promo.t==="1+1")   return p*Math.ceil(q/2);
  if(promo.t==="2e-50") return p*(Math.floor(q/2)*1.5 + q%2);
  return p*q;
}
function promoLabel(promo){
  if(!promo) return "";
  if(promo.t==="pct") return "-"+promo.v+"%";
  if(promo.t==="1+1") return "1+1 gratuit";
  if(promo.t==="2e-50") return "2ᵉ à -50%";
  return "";
}
/* ---- Conditionnements & prix unitaire ----
   "150 g" → 0,15 kg · "4 × 125 g" → 0,5 kg · "6 × 1,5 L" → 9 L · "12 pièces" → 12 pc.
   Sans ça, comparer un 150 g à un 200 g au prix du paquet n'a aucun sens. */
function parseUnit(u){
  if(!u) return null;
  let s=String(u).toLowerCase().replace(/ /g," ").trim();
  let mult=1;
  const mm=s.match(/^(\d+)\s*[×x*]\s*(.+)$/);
  if(mm){ mult=+mm[1]; s=mm[2].trim(); }
  if(/^(pi[eè]ce|pc|unit[ée])s?$/.test(s)) return {q:mult, u:"pc"};
  const m=s.match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|l|cl|ml|pi[eè]ces?|pcs?|rouleaux?|sachets?|capsules?|dosettes?)?\.?$/);
  if(!m) return null;
  const v=parseFloat(m[1].replace(",",".")); if(!(v>0)) return null;
  switch(m[2]){
    case "kg": return {q:v*mult, u:"kg"};
    case "g":  return {q:v*mult/1000, u:"kg"};
    case "l":  return {q:v*mult, u:"L"};
    case "cl": return {q:v*mult/100, u:"L"};
    case "ml": return {q:v*mult/1000, u:"L"};
    default:   return {q:v*mult, u:"pc"};
  }
}
const UNIT_LABEL={kg:"kg", L:"L", pc:"pièce"};
/* Prix pour UNE unité de mesure (kg, L, pièce) — c = coût de qty paquets */
function unitPrice(cat, c, qty){
  const pu=parseUnit(cat.unit);
  if(!pu || !(pu.q>0)) return null;
  return {v:(c/qty)/pu.q, u:pu.u};
}
function unitPriceLabel(cat, c, qty){
  const up=unitPrice(cat, c, qty);
  return up ? `${fmt(up.v)} / ${UNIT_LABEL[up.u]}` : `${fmt(c/qty)} / u.`;
}

/* ---- Fraîcheur du relevé ---- */
function parseISO(iso){ return /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||""); }
function daysSince(iso){
  const m=parseISO(iso); if(!m) return null;
  const then=Date.UTC(+m[1],+m[2]-1,+m[3]);
  const n=new Date(), today=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());
  return Math.max(0, Math.round((today-then)/86400000));
}
function frDate(iso){ const m=parseISO(iso); return m?`${m[3]}/${m[2]}/${m[1]}`:iso; }
function freshnessTag(cat){
  const d=cat.releve;
  if(!d) return `<div class="fresh sim">Prix simulé — jamais relevé en magasin</div>`;
  const days=daysSince(d);
  const cls = days===null ? "" : days<=14 ? "ok" : days<=45 ? "mid" : "old";
  const age = days===null ? "" : days===0 ? " · aujourd'hui" : ` · il y a ${days} j`;
  return `<div class="fresh ${cls}">Relevé le ${frDate(d)}${age}</div>`;
}
/* Meilleure enseigne pour un article donné (qty incluse) */
function bestStoreFor(cat, q){
  let best=null;
  for(const s of DATA.stores){
    const c = cost(cat.prices[s.id], q);
    if(c!==null && (best===null || c<best.cost)) best={store:s, cost:c};
  }
  return best;
}
/* ================== ANALYSE DES PROMOS ======================
   Une promo n'est pas une bonne affaire par définition : chez nous,
   -25 % sur un papier toilette peut rester au-dessus du prix normal
   d'un concurrent. On classe donc chaque promo en la confrontant
   (a) au meilleur prix des autres enseignes pour le MÊME produit,
   (b) au meilleur prix unitaire de sa famille, tous produits confondus. */
function bestOtherStore(cat, storeId, q){
  let best=null;
  for(const s of DATA.stores){
    if(s.id===storeId) continue;
    const c=cost(cat.prices[s.id], q);
    if(c!==null && (best===null || c<best.cost)) best={store:s, cost:c};
  }
  return best;
}
/* Meilleur prix unitaire de la famille (toutes enseignes, promos incluses) */
function bestInFamily(famille, unitType){
  let best=null;
  for(const c of DATA.catalog){
    if(c.famille!==famille) continue;
    const b=bestStoreFor(c,1); if(!b) continue;
    const up=unitPrice(c, b.cost, 1);
    if(!up || up.u!==unitType) continue;
    if(!best || up.v<best.up) best={cat:c, store:b.store, up:up.v, u:up.u};
  }
  return best;
}
/* Quantité à laquelle la promo prend tout son sens : un 1+1 ou un 2ᵉ à -50 %
   n'apporte STRICTEMENT RIEN à une unité — l'évaluer à q=1 le ferait passer
   à tort pour un trompe-l'œil. */
function promoQty(promo){
  return (promo && (promo.t==="1+1" || promo.t==="2e-50")) ? 2 : 1;
}
/* Toutes les promos du catalogue, évaluées et triées par gain réel */
function promoDeals(){
  const out=[];
  for(const cat of DATA.catalog){
    for(const s of DATA.stores){
      const e=cat.prices[s.id];
      if(priceState(e)!==P_OK || !e.promo) continue;
      const q=promoQty(e.promo);
      const net=cost(e,q);                               // total pour q unités
      const perUnit=net/q;
      const other=bestOtherStore(cat, s.id, q);          // concurrents à quantité égale
      const up=unitPrice(cat, net, q);
      const fam=up ? bestInFamily(cat.famille, up.u) : null;
      const betterFam = fam && up && fam.cat.id!==cat.id && fam.up < up.v*0.95 ? fam : null;
      out.push({
        cat, store:s, entry:e, base:e.p, q, net, perUnit, up,
        other,                                             // meilleur concurrent, même produit
        gain: other ? (other.cost-net)/other.cost : null,   // >0 = la promo gagne
        verdict: other ? (net < other.cost-0.001 ? "deal" : "trap") : "unknown",
        betterFam
      });
    }
  }
  return out.sort((a,b)=>(b.gain??-Infinity)-(a.gain??-Infinity));
}

/* Palier de promo : avec un 1+1, acheter 1 coûte exactement le même prix
   qu'acheter 2. Avec un 2ᵉ à -50 %, le 2ᵉ est à moitié prix. L'app doit le
   dire, sinon on paie le plein tarif sans profiter de la remise. */
function promoStep(cat, qty){
  if(qty%2===0) return null;                        // déjà sur un palier
  const curBest=bestStoreFor(cat, qty);
  if(!curBest) return null;
  const unitNow=curBest.cost/qty;
  const to=qty+1;
  /* Le palier peut se trouver dans une AUTRE enseigne que la moins chère
     actuelle : à l'unité Colruyt gagne, mais à deux le 1+1 de Delhaize passe
     devant. On teste donc toutes les enseignes en promo, pas seulement la
     meilleure du moment. */
  let bestStep=null;
  for(const s of DATA.stores){
    const e=cat.prices[s.id];
    if(priceState(e)!==P_OK || !e.promo) continue;
    if(e.promo.t!=="1+1" && e.promo.t!=="2e-50") continue;
    const next=cost(e,to);
    if(next===null) continue;
    const unitNext=next/to;
    if(unitNext >= unitNow-0.001) continue;         // aucun gain réel
    if(!bestStep || unitNext<bestStep.unitNext)
      bestStep={store:s, to, extra:next-curBest.cost, unitNow, unitNext,
                label:promoLabel(e.promo), from:curBest.store};
  }
  return bestStep;
}
function stepBox(it){
  const st=promoStep(it.cat, it.qty);
  if(!st) return "";
  const extraTxt = st.extra<0.005
    ? `<b>sans payer un centime de plus</b>`
    : `pour <b>${fmt(st.extra)}</b> de plus`;
  const move = st.from && st.from.id!==st.store.id ? ` (en passant de ${esc(st.from.name)} à ${esc(st.store.name)})` : "";
  return `<div class="step">
    <span class="stepTxt">${esc(st.label)} chez ${esc(st.store.name)} — passe à ${st.to} ${extraTxt}${move} :
      ${fmt(st.unitNext)}/u. au lieu de ${fmt(st.unitNow)}</span>
    <button class="stepBtn" data-step="${it.uid}" data-to="${st.to}">Passer à ${st.to}</button>
  </div>`;
}
function setQty(uid, q){
  const it=state.items.find(i=>String(i.uid)===String(uid));
  if(!it) return;
  it.qty=Math.max(1, q);
  saveState(); render();
  toast(`${it.name} × ${it.qty}`);
}

/* Articles de la liste enrichis (comparables vs libres) */
function enrichedItems(){
  return state.items.map(it=>{
    const cat = it.catalogId ? catItem(it.catalogId) : null;
    /* orphan : l'article pointait vers une fiche qui n'existe plus (purge du
       catalogue, id renommé). On le garde dans la liste — il reste utile en
       rayon — mais on ne prétend plus pouvoir le comparer. */
    return {...it, cat, orphan: !!it.catalogId && !cat};
  });
}
/* Tri des articles de la liste en trois seaux */
function bucketItems(items){
  const full=[], partial=[], free=[];
  for(const it of items){
    if(!it.cat) free.push(it);
    else if(isComparable(it.cat)) full.push(it);
    else partial.push(it);
  }
  return {full, partial, free};
}
/* Totaux par enseigne — calculés UNIQUEMENT sur les articles comparables
   (prix connu ou indisponibilité confirmée dans les 3 enseignes).
   adj = total "équitable" : un article indisponible dans l'enseigne est
   compté au meilleur prix ailleurs, pour comparer à panier égal. */
function storeTotals(items){
  const res = {};
  for(const s of DATA.stores){
    let total=0, missing=[], extra=0;
    for(const it of items){
      if(!it.cat || !isComparable(it.cat)) continue;
      const c = cost(it.cat.prices[s.id], it.qty);
      if(c===null){ // indisponibilité confirmée
        missing.push(it.name);
        const b=bestStoreFor(it.cat, it.qty);
        if(b) extra+=b.cost;
      } else total+=c;
    }
    res[s.id]={total, missing, adj: total+extra};
  }
  return res;
}
/* Répartition optimale : chaque article chez la moins chère */
function optimalSplit(items){
  const baskets = {}; let total=0;
  for(const s of DATA.stores) baskets[s.id]=[];
  const unmatched=[];
  for(const it of items){
    if(!it.cat){ unmatched.push(it); continue; }
    const best = bestStoreFor(it.cat, it.qty);
    if(!best){ unmatched.push(it); continue; }
    baskets[best.store.id].push({...it, cost:best.cost});
    total+=best.cost;
  }
  return {baskets, total, unmatched};
}
/* Alternatives : produits de la même famille, réellement moins chers.
   La comparaison se fait au prix unitaire (€/kg, €/L, €/pièce) — sinon un
   150 g passerait pour moins cher qu'un 200 g au meilleur rapport. On exige
   un gain d'au moins 5 % pour ne pas proposer d'économies à un centime. */
const ALT_MIN_GAIN = 0.05;
function alternativesFor(it){
  if(!it.cat || !it.cat.famille) return [];
  const cur = bestStoreFor(it.cat, it.qty);
  if(!cur) return [];
  const curUP = unitPrice(it.cat, cur.cost, it.qty);
  return DATA.catalog
    .filter(c=>c.famille===it.cat.famille && c.id!==it.cat.id)
    .map(c=>{
      const best=bestStoreFor(c, it.qty);
      if(!best) return null;
      const up=unitPrice(c, best.cost, it.qty);
      if(curUP && up && up.u===curUP.u){
        const gain=(curUP.v-up.v)/curUP.v;
        return gain>=ALT_MIN_GAIN ? {c, best, up, curUP, gain} : null;
      }
      // conditionnements non normalisables : on ne compare qu'à format identique
      if(String(c.unit||"")===String(it.cat.unit||"") && best.cost < cur.cost*(1-ALT_MIN_GAIN))
        return {c, best, up:null, curUP:null, gain:(cur.cost-best.cost)/cur.cost};
      return null;
    })
    .filter(Boolean)
    .sort((a,b)=>b.gain-a.gain)
    .slice(0,2)
    .map(a=>({...a, save:cur.cost-a.best.cost}));
}
function swapItem(uid, toId){
  const it = state.items.find(i=>String(i.uid)===String(uid));
  const target = catItem(toId);
  if(!it || !target) return;
  const existing = state.items.find(i=>i.catalogId===toId && i!==it);
  if(existing){ existing.qty += it.qty; state.items = state.items.filter(i=>i!==it); }
  else { it.catalogId = toId; it.name = target.name; }
  saveState(); render();
  toast("Remplacé par : "+target.name);
}

/* ==================== ÉCRAN PRODUITS ====================
   Une logique par écran : PRODUITS ajoute, LISTE coche, PRIX analyse.
   Ici : la base des produits du foyer en tuiles (tap = sur la liste,
   re-tap = retirée), la recherche, le scanner, le mode édition (✎),
   les tickets lus par Claude, et l'export vers Claude.               */

/* Rapproche un favori du catalogue de prix : par nom (inclusion dans un
   sens ou l'autre), par recouvrement de mots, sinon par famille. */
function favCatalogMatch(f){
  const n = norm(f.nom);
  let hit = DATA.catalog.find(c => {
    const cn = norm(c.name);
    return cn && (n.includes(cn) || cn.includes(n));
  });
  if(!hit){
    const toks = s => new Set(norm(s).split(/[^a-z0-9%]+/).filter(t=>t.length>2 || /\d/.test(t)));
    const ft = toks(f.nom);
    let bestScore = 0.69;
    for(const c of DATA.catalog){
      const ct = toks(c.name);
      if(!ct.size) continue;
      let inter = 0;
      for(const t of ct) if(ft.has(t)) inter++;
      const score = inter / Math.min(ct.size, ft.size || 1);
      if(score > bestScore){ bestScore = score; hit = c; }
    }
  }
  if(!hit && f.famille){
    const cands = DATA.catalog.filter(c => c.famille===f.famille && bestStoreFor(c,1));
    cands.sort((a,b)=>{
      const ua=unitPrice(a,bestStoreFor(a,1).cost,1), ub=unitPrice(b,bestStoreFor(b,1).cost,1);
      return (ua?ua.v:Infinity)-(ub?ub.v:Infinity);
    });
    hit = cands[0]||null;
  }
  return hit||null;
}
function favListItem(f){
  const m=favCatalogMatch(f);
  return m ? state.items.find(i=>i.catalogId===m.id)
           : state.items.find(i=>!i.catalogId && i.name===f.nom);
}
function addFavToList(id){
  const f = stockItem(id); if(!f) return;
  const m = favCatalogMatch(f);
  if(m){ addItem(m.id, null); } else { addItem(null, f.nom); }
}
function toggleFavInList(id){
  const f=stockItem(id); if(!f) return;
  const it=favListItem(f);
  if(it){
    state.items=state.items.filter(i=>i!==it);
    saveState(); render(); toast("Retiré : "+f.nom);
  }else{
    addFavToList(id);
  }
}
function tileLabel(nom){
  return nom.replace(/\s*\([^)]*\)\s*/g," ").replace(/\s*\d+\s*[×x]?\s*\d*\s*(g|kg|ml|cl|l)\b/gi,"").trim() || nom;
}
function isCustomPoste(id){ return stock.custom.some(p=>p.id===id); }

let prodQuery="", prodEdit=false, stockEdit=null;   // stockEdit : id en édition, ou "new"

function favForm(){
  const isNew = stockEdit==="new";
  const p = isNew ? {nom:"",categorie:""} : stockItem(stockEdit)||{};
  const editable = isNew || isCustomPoste(stockEdit);
  return `<div class="card posteForm">
    <b>${isNew?"Nouveau produit":"Modifier « "+esc(p.nom)+" »"}</b>

      <label>Nom (marque + produit) <input id="pfNom" type="text" placeholder="ex : Barilla Spaghetti n°5" value="${esc(p.nom)}"></label>
      <label>Catégorie <input id="pfCat" type="text" placeholder="ex : Épicerie" value="${esc(stripEmoji(p.categorie||""))}"></label>`
    :`<div class="small muted" style="margin-top:6px">Ce produit vient de <code>data/stock.csv</code> — il se modifie dans le repo (demande à Claude).</div>`}
    <div class="bactions">
      ${editable?`<button id="pfSave" class="primaryBtn">Enregistrer</button>`:""}
      ${!isNew && editable?`<button id="pfDelete" style="color:var(--danger)">Supprimer</button>`:""}

function refillCardsHtml(){
  let out="";
  for(const [batch,rows] of pendingRefills()){
    out+=`<div class="card refillCard">
      <b class="rcpt">${I.receipt} ${esc(batch)}</b>
      <div class="small" style="margin:6px 0 8px">${rows.map(r=>{

      }).join(" · ")}</div>
      <div class="bactions">

function bindRefillCards(body){
  body.querySelectorAll("[data-refill]").forEach(b=>b.onclick=()=>applyRefill(b.dataset.refill));
  body.querySelectorAll("[data-norefill]").forEach(b=>b.onclick=()=>dismissRefill(b.dataset.norefill));
}

function renderProduits(){
  const body=$("#prodBody");
  const q=norm(prodQuery.trim());
  let html="";

  /* actions : scanner (le geste principal d'enrichissement) + mode édition */
  html+=`<div class="stkTools">
    <button class="primaryBtn" id="scanBtn">${I.camera} Scanner un produit</button>
    <button id="prodEditBtn" class="${prodEdit?"editOn":""}">${prodEdit?"Terminer l'édition":"✎ Modifier"}</button>
  </div>`;

  if(stockEdit) html+=favForm();
  html+=refillCardsHtml();

  const favs=stockItems().filter(f=>!q || norm(f.nom).includes(q));
  if(!stockItems().length){
    html+=`<div class="empty"><div class="big">${I.grid}</div><b>Aucun produit pour l'instant</b>
      <div class="small">Cette base rassemble ce que vous aimez et rachetez. Scanne les paquets de la maison ou photographie un ticket pour Claude — chaque produit deviendra une tuile.</div></div>`;
  }else{
    const byCat=new Map();
    for(const f of favs){
      const k=stripEmoji(f.categorie||"Divers")||"Divers";
      if(!byCat.has(k)) byCat.set(k,[]);
      byCat.get(k).push(f);
    }
    if(!favs.length){
      html+=`<div class="empty" style="padding:26px"><b>Rien ne correspond à « ${esc(prodQuery)} »</b></div>`;
    }
    for(const [cat,arr] of [...byCat.entries()].sort((a,b)=>a[0].localeCompare(b[0],"fr"))){
      html+=`<div class="catTitle">${esc(cat)}</div><div class="favGrid">`;
      html+=arr.sort((a,b)=>a.nom.localeCompare(b.nom,"fr")).map(f=>{
        const inList=!!favListItem(f);
        const lbl=tileLabel(f.nom);
        return `<button class="tile ${inList?"in":""} ${prodEdit?"edit":""}" data-tile="${esc(f.id)}">
          <span class="tIni">${prodEdit?"✎":(inList?"✓":esc(lbl.charAt(0).toUpperCase()))}</span>
          <span class="tName">${esc(lbl)}</span>
        </button>`;
      }).join("");
      html+=`</div>`;
    }
    /* tuile de création, toujours en fin */
    html+=`<div class="favGrid" style="margin-top:9px"><button class="tile plus" id="newFav">
      <span class="tIni">+</span><span class="tName">Nouveau produit</span></button></div>`;
  }

  /* recherche : le catalogue de prix connaît peut-être des produits
     qui ne sont pas encore dans la base — on les propose à l'ajout direct */
  if(q){
    const favIds=new Set(stockItems().map(f=>{ const m=favCatalogMatch(f); return m?m.id:null; }));
    const extra=DATA.catalog.filter(c=>norm(c.name).includes(q) && !favIds.has(c.id)).slice(0,6);
    if(extra.length){
      html+=`<div class="catTitle">Dans le catalogue de prix</div>`;
      html+=extra.map(c=>{
        const best=bestStoreFor(c,1);
        const inList=state.items.some(i=>i.catalogId===c.id);
        return `<div class="prod">
          <div class="pmain"><div class="pname">${esc(c.name)}</div>
          <div class="psub">${esc(c.unit||"")}${best?` · dès <b>${fmt(best.cost)}</b> chez ${esc(best.store.name)}`:""}</div></div>
          <button class="addP ${inList?"in":""}" data-addcat="${esc(c.id)}">${inList?"✓":"+"}</button>
        </div>`;
      }).join("");
    }
  }

  html+=`<div class="small muted" style="text-align:center; margin:18px 0 6px">
    <button class="linkBtn" id="exportStock">Exporter les produits pour Claude</button></div><div id="exportBox"></div>`;

  body.innerHTML=html;
  const on=(sel,fn)=>{ const el=body.querySelector(sel); if(el) el.onclick=fn; };
  on("#scanBtn", openScanner);
  on("#prodEditBtn", ()=>{ prodEdit=!prodEdit; stockEdit=null; renderProduits(); });
  on("#newFav", ()=>{ stockEdit="new"; renderProduits(); });
  on("#pfCancel", ()=>{ stockEdit=null; renderProduits(); });
  on("#pfSave", ()=>{
    const nom=((body.querySelector("#pfNom")||{}).value||"").trim();
    if(!nom){ toast("Il faut un nom"); return; }
    const cat=((body.querySelector("#pfCat")||{}).value||"Divers").trim();
    if(stockEdit==="new"){
      const id=slugify(nom)||("fav-"+stock.custom.length);
      if(stockItem(id)){ toast("Ce produit existe déjà"); return; }
      stock.custom.push({id, nom, categorie:cat, unite:"pièce", seuil:0, famille:"", note:""});
    }else if(isCustomPoste(stockEdit)){
      const c=stock.custom.find(p=>p.id===stockEdit);
      c.nom=nom; c.categorie=cat;
    }
    stockEdit=null; saveStock(); render(); toast("Produit enregistré");
  });
  on("#pfDelete", ()=>{
    const id=stockEdit;
    stock.custom=stock.custom.filter(p=>p.id!==id);
    delete stock.qty[id]; delete stock.seuil[id];
    for(const [ean,pid] of Object.entries(stock.ean)) if(pid===id) delete stock.ean[ean];
    stockEdit=null; saveStock(); render(); toast("Produit supprimé");
  });
  body.querySelectorAll("[data-tile]").forEach(b=>b.onclick=()=>{
    if(prodEdit){ stockEdit=b.dataset.tile; renderProduits(); window.scrollTo(0,0); }
    else toggleFavInList(b.dataset.tile);
  });
  body.querySelectorAll("[data-addcat]").forEach(b=>b.onclick=()=>{ addItem(b.dataset.addcat,null); renderProduits(); });
  bindRefillCards(body);
  on("#exportStock", showStockExport);
}
function showStockExport(){
  const box=$("#exportBox");
  const eansOf=id=>Object.entries(stock.ean).filter(([,pid])=>pid===id).map(([e])=>e).join("|");
  const rows=[["id","nom","categorie","famille","eans"].join(";")];
  for(const p of stockItems())
    rows.push([p.id,p.nom,stripEmoji(p.categorie||""),p.famille||"",eansOf(p.id)].join(";"));
  const csv=rows.join("\n");
  box.innerHTML=`<div class="card">
    <b>Vos produits au format CSV</b>
    <div class="small muted" style="margin:4px 0 8px">À transmettre à Claude pour ses relevés de prix (noms, catégories, codes-barres).</div>
    <textarea class="exportTa" readonly rows="8">${esc(csv)}</textarea>
    <div class="bactions"><button id="copyStock">Copier</button><button id="closeExport">Fermer</button></div>
  </div>`;
  box.querySelector("#copyStock").onclick=()=>{

  box.querySelector("#closeExport").onclick=()=>{ box.innerHTML=""; };
  box.scrollIntoView({behavior:"smooth", block:"nearest"});

/* ==================== SCANNER DE CODES-BARRES ====================
   Contrainte : sur iPhone, l'API navigateur BarcodeDetector est désactivée
   par défaut quelle que soit la version de Safari. On passe donc par
   html5-qrcode (décodage JS/WASM), chargé DEPUIS LE RÉSEAU et SEULEMENT à
   l'ouverture du scanner — inutile d'alourdir le démarrage de l'app.

   La saisie manuelle n'est pas un gadget : en magasin, entre la lumière,
   les emballages froissés et les permissions caméra, elle sauve la mise. */
const H5Q_URL="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";
const OFF_UA="MesCourses-Enzo/1.0";
let h5qLoaded=false, scanner=null, scanBusy=false;

function loadH5Q(){
  if(h5qLoaded) return Promise.resolve();
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=H5Q_URL;
    s.onload=()=>{ h5qLoaded=true; res(); };
    s.onerror=()=>rej(new Error("chargement impossible"));
    document.head.appendChild(s);
  });
}
function scanMsg(txt, err){
  const el=document.querySelector("#scanMsg");
  if(el){ el.textContent=txt; el.classList.toggle("err", !!err); }
}
function openScanner(){
  if(document.querySelector(".scanWrap")) return;
  const wrap=document.createElement("div");
  wrap.className="scanWrap";
  wrap.innerHTML=`
    <div class="scanHead">Scanner un produit <button id="scanClose" aria-label="Fermer">✕</button></div>
    <div id="scanView"></div>
    <div class="scanFoot">
      <div class="scanMsg" id="scanMsg">Démarrage de la caméra…</div>
      <div class="manual">
        <input id="scanManual" type="text" inputmode="numeric" placeholder="ou tape le code-barres (13 chiffres)">
        <button id="scanGo">OK</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector("#scanClose").onclick=closeScanner;
  scanFeedback("Démarrage de la caméra…", {quiet:true});

  loadH5Q().then(()=>{
    scanner=new Html5Qrcode("scanView", { formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,  Html5QrcodeSupportedFormats.UPC_E,
    ]});
    return scanner.start({facingMode:"environment"},
      {fps:10, qrbox:{width:260, height:160}},
      code=>handleBarcode(code),
      ()=>{});
  }).then(()=>{
    scanFeedback("Vise les codes-barres — chaque produit compte tout seul, pas besoin de toucher l'écran.", {quiet:true});
  }).catch(err=>{
    const m=String(err && err.message || err);
    scanMsg(/chargement/.test(m)
      ? "Impossible de charger le lecteur (pas de réseau ?). Tape le code à la main ci-dessous."
      : "Caméra indisponible : "+m+". Tape le code à la main ci-dessous.", true);
  });
}
function closeScanner(){
  const wrap=document.querySelector(".scanWrap");
  const done=()=>{ if(wrap) wrap.remove(); scanner=null; scanBusy=false; };
  if(scanner){ scanner.stop().then(done).catch(done); } else done();
}

/* Open Food Facts : lecture libre, sans clé. Le navigateur interdisant de
   fixer le User-Agent, on s'identifie via les paramètres de requête. */
async function lookupBarcode(code){
  const url=`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json`
    +`?fields=code,product_name,product_name_fr,brands,quantity`
    +`&app_name=${encodeURIComponent(OFF_UA)}`;
  const ctl=new AbortController();
  const to=setTimeout(()=>ctl.abort(), 8000);
  try{
    const r=await fetch(url,{signal:ctl.signal});
    clearTimeout(to);
    if(!r.ok) return null;
    const d=await r.json();
    if(!d || d.status!==1 || !d.product) return null;
    const p=d.product;
    const nom=[p.brands ? String(p.brands).split(",")[0].trim() : "",
               p.product_name_fr || p.product_name || ""].filter(Boolean).join(" ").trim();
    return {code, nom: nom || null, quantite: p.quantity || ""};
  }catch(e){ clearTimeout(to); return null; }
}

/* ---- Scan en continu, zéro clic ----------------------------------
   Objectif : enchaîner les paquets dans la cuisine sans jamais toucher
   l'écran. Chaque code détecté agit immédiatement :
     connu   → +1 sur son poste (bip aigu)
     inconnu → identité Open Food Facts, poste créé automatiquement,
               code rattaché, +1 (double bip)
   Les corrections (Annuler / Rattacher) sont des boutons OPTIONNELS dans
   le bandeau du bas — la caméra ne s'arrête jamais pour poser une question.

   Piège à connaître : le décodeur émet le même code ~10×/seconde tant que
   le paquet est devant la caméra. Un temps mort de 2,5 s par code évite
   les +10 accidentels ; re-viser le même paquet APRÈS le temps mort fait
   bien +1 — c'est comme ça qu'on compte trois paquets identiques. */
const SCAN_COOLDOWN_MS=2500;
const lastScanAt={};                 // code → timestamp de dernier traitement
let lastAction=null;                 // pour Annuler : {posteId, code, prevQty, created}

function beep(double){
  try{
    const ctx=beep.ctx||(beep.ctx=new (window.AudioContext||window.webkitAudioContext)());
    const note=(t,f)=>{ const o=ctx.createOscillator(), g=ctx.createGain();
      o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+.12);
      o.start(t); o.stop(t+.13); };
    note(ctx.currentTime, 880);
    if(double) note(ctx.currentTime+.15, 660);
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(double?[40,60,40]:40); }catch(e){}
}

async function handleBarcode(code){
  const now=Date.now();
  if(lastScanAt[code] && now-lastScanAt[code]<SCAN_COOLDOWN_MS) return; // même paquet encore devant la caméra
  lastScanAt[code]=now;
  if(scanBusy) return;               // un lookup OFF est déjà en cours

  /* 1) Code connu : le produit est déjà dans la base — on propose juste
     de le mettre sur la liste de courses, sans rien modifier d'office. */
  const known=stock.ean[code];
  if(known){
    const p=stockItem(known);
    if(p){
      lastAction={posteId:p.id, code, created:false, listed:false};
      beep(false);
      scanFeedback(`✓ ${p.nom} — déjà dans vos produits`, {listable:true});
      return;
    }
    delete stock.ean[code];          // le favori a disparu, on oublie le lien
  }

  /* 2) Code inconnu : identité OFF puis création automatique du poste. */
  scanBusy=true;
  scanFeedback("Nouveau produit, identification…", {quiet:true});
  try{
    const info=await lookupBarcode(code);
    const label=info && info.nom
      ? info.nom + (info.quantite ? ` (${info.quantite})` : "")
      : `Code ${code}`;
    let id=slugify(label)||("scan-"+code);
    const existed=!!stockItem(id);
    if(!existed)
      stock.custom.push({id, nom:label, categorie:"📦 Divers", unite:"pièce", seuil:0, famille:"", note:""});
    stock.ean[code]=id;
    lastAction={posteId:id, code, created:!existed, listed:false};
    saveStock(); render();
    beep(true);
    scanFeedback(`Ajouté à vos produits : ${label}`, {correctable:true, listable:true});
  }finally{
    lastScanAt[code]=Date.now();     // le lookup a pu durer : on repart de la fin
    scanBusy=false;
  }
}

/* Bandeau du bas : dernier scan + corrections optionnelles + saisie manuelle.
   Jamais bloquant — remplacé au scan suivant. */
function scanFeedback(msg, opts){
  const wrap=document.querySelector(".scanWrap"); if(!wrap) return;
  const foot=wrap.querySelector(".scanFoot");
  const o=opts||{};
  foot.innerHTML=`
    <div class="scanMsg" id="scanMsg">${esc(msg)}</div>
    ${o.quiet?"":`<div class="scanActions">
      ${lastAction?`<button id="scanUndo">↩︎ Annuler</button>`:""}
      ${o.listable?`<button id="scanToList">+ Mettre sur la liste</button>`:""}
      ${o.correctable?`<button id="scanRelink">C'est un doublon d'un produit</button>`:""}
    </div>`}
    <div class="manual">
      <input id="scanManual" type="text" inputmode="numeric" placeholder="ou tape le code-barres (13 chiffres)">
      <button id="scanGo">OK</button>
    </div>`;
  const on=(sel,fn)=>{ const el=foot.querySelector(sel); if(el) el.onclick=fn; };
  on("#scanUndo", undoLastScan);
  on("#scanToList", ()=>{
    if(!lastAction) return;
    addFavToList(lastAction.posteId);
    lastAction.listed=true;
    scanFeedback("Sur la liste ✓ — vise le produit suivant.", {quiet:true});
  });
  on("#scanRelink", ()=>askRelink(lastAction));
  on("#scanGo", ()=>{
    const v=(foot.querySelector("#scanManual").value||"").replace(/\D/g,"");
    if(v.length<8){ scanMsg("Un code-barres fait au moins 8 chiffres.", true); return; }
    delete lastScanAt[v];            // saisie volontaire : pas de temps mort
    handleBarcode(v);
  });
  const inp=foot.querySelector("#scanManual");
  if(inp) inp.addEventListener("keydown", e=>{ if(e.key==="Enter") on && foot.querySelector("#scanGo").click(); });
}
function undoLastScan(){
  if(!lastAction) return;
  const a=lastAction; lastAction=null;
  if(a.created){
    stock.custom=stock.custom.filter(p=>p.id!==a.posteId);
    delete stock.qty[a.posteId]; delete stock.seuil[a.posteId];
    delete stock.ean[a.code];
    saveStock(); render();
    scanFeedback(`↩︎ Favori supprimé. Vise le produit suivant.`, {quiet:true});
  }else{
    scanFeedback(`↩︎ OK. Vise le produit suivant.`, {quiet:true});
  }
}
/* Le poste auto-créé n'était pas le bon ? On déplace la quantité et le
   code-barres vers un poste existant — le seul moment où un choix s'affiche,
   et uniquement parce qu'on l'a demandé. */
function askRelink(action){
  const wrap=document.querySelector(".scanWrap"); if(!wrap || !action) return;
  const foot=wrap.querySelector(".scanFoot");
  const others=stockItems().filter(p=>p.id!==action.posteId);
  if(!others.length){ scanFeedback("Aucun autre poste. Continue à scanner.", {quiet:true}); return; }
  foot.innerHTML=`
    <div class="scanMsg" id="scanMsg">Ce code correspond à quel produit ?</div>
    <div class="manual" style="flex-direction:column; gap:6px">
      ${others.map(p=>`<button class="stapleOpt" data-st="${esc(p.id)}" style="width:100%">${esc(p.nom)}</button>`).join("")}
      <button class="stapleOpt" data-cancel="1" style="width:100%; background:#333">Laisser tel quel</button>
    </div>`;
  foot.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{
    const target=stockItem(b.dataset.st);
    if(action.created){
      stock.custom=stock.custom.filter(p=>p.id!==action.posteId);
      delete stock.qty[action.posteId]; delete stock.seuil[action.posteId];
    }
    stock.ean[action.code]=target.id;
    saveStock(); render();
    lastAction={posteId:target.id, code:action.code, created:false, listed:false};
    scanFeedback(`✓ code rattaché à « ${target.nom} »`, {listable:true});
  });
  foot.querySelector("[data-cancel]").onclick=()=>scanFeedback("OK. Vise le produit suivant.", {quiet:true});
}

/* ---- Promos ---- */
function promoCard(d){
  const inList=state.items.some(i=>i.catalogId===d.cat.id);
  const upTxt = d.up ? ` · ${fmt(d.up.v)}/${UNIT_LABEL[d.up.u]}` : "";
  const forQ = d.q>1 ? ` pour ${d.q}` : "";
  const vs = d.q>1 ? `${esc(d.other && d.other.store.name)} à ${d.q}` : esc(d.other && d.other.store.name);
  let verdictLine;
  if(d.verdict==="deal")
    verdictLine=`<div class="vLine good">${Math.round(d.gain*100)} % moins cher que ${vs} (${fmt(d.other.cost)})</div>`;
  else if(d.verdict==="trap")
    verdictLine=`<div class="vLine bad">${vs} reste moins cher sans promo : ${fmt(d.other.cost)}</div>`;
  else
    verdictLine=`<div class="vLine unk">Seul prix connu — à confirmer en relevant les autres enseignes</div>`;
  const qLine = d.q>1
    ? `<div class="vLine unk">Remise effective à partir de ${d.q} unités — à l'unité, tu paies le plein tarif (${fmt(d.base)})</div>`
    : "";
  const famLine = d.betterFam
    ? `<div class="vLine warnLine">Meilleur rapport dans « ${esc(famLabel(d.cat.famille))} » : <b>${esc(d.betterFam.cat.name)}</b> chez ${esc(d.betterFam.store.name)} à ${fmt(d.betterFam.up)}/${UNIT_LABEL[d.betterFam.u]}</div>`
    : "";
  return `<div class="card promoCard ${d.verdict}">
    <div class="cmpHead">
      <b>${esc(d.cat.name)}</b>
      <span class="qtyTag">${esc(d.cat.unit||"")}</span>
    </div>
    ${freshnessTag(d.cat)}
    <div class="promoRow">
      <span class="promoTag">${promoLabel(d.entry.promo)}</span>
      <span class="pStore" style="color:${d.store.color}">${esc(d.store.name)}</span>
      <span class="pPrice"><span class="strike">${fmt(d.base*d.q)}</span> <b>${fmt(d.net)}</b>${forQ}<span class="muted small">${upTxt}</span></span>
