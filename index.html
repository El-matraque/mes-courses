/* ---- Inventaire ---- */
let stockEdit = null;    // id du poste en cours d'édition de seuil, ou "new"
function stockRow(p){
  const ratio = p.seuil>0 ? p.qty/p.seuil : 1;
  const cls = p.qty<=0 ? "vide" : ratio<1 ? "bas" : "ok";
  const pct = Math.max(0, Math.min(100, p.seuil>0 ? ratio*100 : 100));
  const u = p.unite||"";
  return `<div class="stk ${cls}">
    <div class="stkMain">
      <div class="stkName">${esc(p.nom)}${p.note?` <span class="muted small">${esc(p.note)}</span>`:""}</div>
      <div class="stkBar"><span style="width:${pct}%"></span></div>
      <div class="stkSub">
        <b>${p.qty}</b> ${esc(u)} en stock · seuil ${p.seuil} ${esc(u)}
        <button class="linkBtn" data-seuil="${esc(p.id)}">modifier</button>
      </div>
    </div>
    <div class="qty">
      <button data-dec="${esc(p.id)}">−</button>
      <button data-inc="${esc(p.id)}">+</button>
    </div>
  </div>`;
}
function renderStock(){
  const body=$("#stockBody");
  const items=stockItems();
  const missing=missingStock();

  let html=`<div class="stkTools">
    <button class="primaryBtn" id="scanBtn">📷 Scanner un produit</button>
    <button id="newPoste">+ Nouveau poste</button>
  </div>`;

  if(stockEdit) html+=posteForm();

  if(items.length===0 && !stockEdit){
    html+=`<div class="empty"><div class="big">🧊</div><b>Aucun poste de stock</b>
      <div class="small">Un « poste » = quelque chose que vous devez toujours avoir en réserve : 2 kg de pâtes, 6 rouleaux de papier toilette, 1 L d'huile d'olive.<br><br>
      Crée-les ici, ou dicte-les à Claude : il les écrira dans <code>data/stock.csv</code>, où ils seront versionnés et lisibles hors de l'app.</div></div>`;
    body.innerHTML=html;
    bindStock(body);
    return;
  }

  if(missing.length){
    html+=`<div class="card warn">
      <b>🔻 ${missing.length} poste(s) sous le seuil</b>
      <div class="small">${missing.map(p=>`${esc(p.nom)} <span class="muted">(${p.qty}/${p.seuil} ${esc(p.unite||"")})</span>`).join(" · ")}</div>
      <div class="bactions"><button id="addMissing">+ Ajouter les manquants à la liste</button></div>
    </div>`;
  }else if(items.length){
    html+=`<div class="card small" style="background:var(--accent-soft); border-color:#bfe6cc; color:var(--accent); font-weight:600">✅ Tous les postes sont au-dessus du seuil</div>`;
  }

  const byCat=new Map();
  for(const p of items){
    const k=p.categorie||"📦 Divers";
    if(!byCat.has(k)) byCat.set(k,[]);
    byCat.get(k).push(p);
  }
  for(const [cat,arr] of [...byCat.entries()].sort((a,b)=>a[0].localeCompare(b[0],"fr"))){
    html+=`<div class="catTitle">${esc(cat)}</div>`;
    html+=arr.sort((a,b)=>a.nom.localeCompare(b.nom,"fr")).map(stockRow).join("");
  }
  html+=`<div class="card"><div class="bactions">
    <button id="exportStock">⇪ Exporter l'inventaire</button>
  </div><div class="small muted" style="margin-top:6px">L'export produit le CSV complet (postes, seuils, quantités) à transmettre à Claude ou à coller dans <code>data/stock.csv</code> — c'est ce qui lui permet de savoir ce qu'il te reste.</div></div>`;
  html+=`<div id="exportBox"></div>`;
  body.innerHTML=html;
  bindStock(body);
}
/* Un poste créé dans l'app (stock.custom) est entièrement éditable — y compris
   son nom : indispensable pour renommer les « Code 5400… » que le scan crée
   quand Open Food Facts ne connaît pas le produit. Un poste venant de
   data/stock.csv garde son identité (elle se change dans le repo) ; seul son
   seuil est modifiable localement. */
function isCustomPoste(id){ return stock.custom.some(p=>p.id===id); }
function posteForm(){
  const isNew = stockEdit==="new";
  const p = isNew ? {id:"",nom:"",categorie:"",unite:"pièce",seuil:1,note:""} : stockItem(stockEdit)||{};
  const editable = isNew || isCustomPoste(stockEdit);
  return `<div class="card posteForm">
    <b>${isNew?"Nouveau poste de stock":"Modifier « "+esc(p.nom)+" »"}</b>
    ${editable?`
      <label>Nom <input id="pfNom" type="text" placeholder="ex : Pâtes sèches" value="${esc(p.nom)}"></label>
      <label>Catégorie <input id="pfCat" type="text" placeholder="ex : 🥫 Épicerie" value="${esc(p.categorie)}"></label>
      <label>Unité <input id="pfUnite" type="text" placeholder="kg, L, pièce, paquet" value="${esc(p.unite)}"></label>`
    :`<div class="small muted" style="margin-top:6px">Ce poste vient de <code>data/stock.csv</code> — son nom se change dans le repo (demande à Claude). Ici, seul le seuil est modifiable.</div>`}
    <label>Seuil — quantité à toujours avoir
      <input id="pfSeuil" type="number" inputmode="decimal" min="0" step="0.5" value="${p.seuil}"></label>
    <div class="bactions">
      <button id="pfSave" class="primaryBtn">Enregistrer</button>
      ${!isNew && editable?`<button id="pfDelete" style="color:var(--danger)">Supprimer</button>`:""}
      <button id="pfCancel">Annuler</button>
    </div>
  </div>`;
}
function bindStock(body){
  const on=(sel,fn)=>{ const el=body.querySelector(sel); if(el) el.onclick=fn; };
  on("#scanBtn", openScanner);
  on("#newPoste", ()=>{ stockEdit="new"; renderStock(); });
  on("#pfCancel", ()=>{ stockEdit=null; renderStock(); });
  on("#pfSave", ()=>{
    const seuil=parseFloat((body.querySelector("#pfSeuil")||{}).value)||0;
    if(stockEdit==="new"){
      const nom=(body.querySelector("#pfNom")||{}).value||"";
      if(!nom.trim()){ toast("Il faut un nom"); return; }
      const id=slugify(nom)||("poste-"+stock.custom.length);
      if(stockItem(id)){ toast("Ce poste existe déjà"); return; }
      stock.custom.push({id, nom:nom.trim(),
        categorie:((body.querySelector("#pfCat")||{}).value||"📦 Divers").trim(),
        unite:((body.querySelector("#pfUnite")||{}).value||"pièce").trim(),
        seuil, famille:"", note:""});
    }else if(isCustomPoste(stockEdit)){
      /* poste créé dans l'app : tout est éditable, l'id ne bouge pas
         (les codes-barres mémorisés pointent dessus) */
      const c=stock.custom.find(p=>p.id===stockEdit);
      const nom=((body.querySelector("#pfNom")||{}).value||"").trim();
      if(!nom){ toast("Il faut un nom"); return; }
      c.nom=nom;
      c.categorie=((body.querySelector("#pfCat")||{}).value||"📦 Divers").trim();
      c.unite=((body.querySelector("#pfUnite")||{}).value||"pièce").trim();
      c.seuil=seuil; delete stock.seuil[stockEdit];
    }else{
      stock.seuil[stockEdit]=seuil;      // override local du seuil du CSV
    }
    stockEdit=null; saveStock(); render(); toast("Poste enregistré");
  });
  on("#pfDelete", ()=>{
    const id=stockEdit;
    stock.custom=stock.custom.filter(p=>p.id!==id);
    delete stock.qty[id]; delete stock.seuil[id];
    for(const [ean,pid] of Object.entries(stock.ean)) if(pid===id) delete stock.ean[ean];
    stockEdit=null; saveStock(); render(); toast("Poste supprimé");
  });
  body.querySelectorAll("[data-seuil]").forEach(b=>b.onclick=()=>{ stockEdit=b.dataset.seuil; renderStock(); });
  body.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{
    const p=stockItem(b.dataset.inc); setStockQty(p.id, p.qty+stepFor(p));
  });
  body.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{
    const p=stockItem(b.dataset.dec); setStockQty(p.id, p.qty-stepFor(p));
  });
  on("#addMissing", addMissingToList);
  on("#exportStock", showStockExport);
}
/* Un pas de 1 pour des pièces, de 0,5 pour du poids/volume */
function stepFor(p){ return /kg|l\b|litre/i.test(p.unite||"") ? 0.5 : 1; }

function addMissingToList(){
  const missing=missingStock();
  if(!missing.length) return;
  let added=0;
  for(const p of missing){
    /* Si le poste pointe vers une famille du catalogue, on ajoute le produit
       le moins cher de cette famille — sinon un article libre au nom du poste. */
    let target=null;
    if(p.famille){
      const cands=DATA.catalog.filter(c=>c.famille===p.famille && bestStoreFor(c,1));
      if(cands.length){
        cands.sort((a,b)=>{
          const ua=unitPrice(a,bestStoreFor(a,1).cost,1), ub=unitPrice(b,bestStoreFor(b,1).cost,1);
          return (ua?ua.v:bestStoreFor(a,1).cost)-(ub?ub.v:bestStoreFor(b,1).cost);
        });
        target=cands[0];
      }
    }
    if(target){
      if(!state.items.some(i=>i.catalogId===target.id)){ addItemSilent(target.id, null); added++; }
    }else{
      const label=`${p.nom} (${p.manque} ${p.unite||""})`.trim();
      if(!state.items.some(i=>!i.catalogId && i.name===label)){ addItemSilent(null, label); added++; }
    }
  }
  saveState(); render();
  toast(added ? `${added} article(s) ajouté(s) à la liste` : "Déjà tous dans la liste");
}
function showStockExport(){
  const box=$("#exportBox");
  const rows=[["id","nom","categorie","unite","seuil","famille","note","quantite"].join(";")];
  for(const p of stockItems())
    rows.push([p.id,p.nom,p.categorie||"",p.unite||"",p.seuil,p.famille||"",p.note||"",p.qty].join(";"));
  const csv=rows.join("\n");
  box.innerHTML=`<div class="card">
    <b>Inventaire au format CSV</b>
    <div class="small muted" style="margin:4px 0 8px">Les 7 premières colonnes correspondent à <code>data/stock.csv</code> ; <code>quantite</code> est l'état du moment, à transmettre à Claude.</div>
    <textarea class="exportTa" readonly rows="8">${esc(csv)}</textarea>
    <div class="bactions"><button id="copyStock">📋 Copier</button><button id="closeExport">Fermer</button></div>
  </div>`;
  box.querySelector("#copyStock").onclick=()=>{
    (navigator.clipboard?navigator.clipboard.writeText(csv):Promise.reject())
      .then(()=>toast("Inventaire copié ✓"), ()=>toast("Copie impossible — sélectionne le texte"));
  };
  box.querySelector("#closeExport").onclick=()=>{ box.innerHTML=""; };
  box.scrollIntoView({behavior:"smooth", block:"nearest"});
}

/* ==================== SCANNER DE CODES-BARRES ====================
   Contrainte : sur iPhone, l'API navigateur BarcodeDetector est désactivée
   par défaut quelle que soit la version de Safari. On passe donc par
   html5-qrcode (décodage JS/WASM), chargé DEPUIS LE RÉSEAU et SEULEMENT à
   l'ouverture du scanner — inutile d'alourdir le démarrage de l'app.

   La saisie manuelle n'est pas un gadget : en magasin, entre la lumière,
   les emballages froissés et les permissions caméra, elle sauve la mise. */
const H5Q_URL="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";
const OFF_UA="MesCourses-Enzo/1.0";
let h5qLoaded=false, scanner=null, scanBusy=false;

function loadH5Q(){
  if(h5qLoaded) return Promise.resolve();
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=H5Q_URL;
    s.onload=()=>{ h5qLoaded=true; res(); };
    s.onerror=()=>rej(new Error("chargement impossible"));
    document.head.appendChild(s);
  });
}
function scanMsg(txt, err){
  const el=document.querySelector("#scanMsg");
  if(el){ el.textContent=txt; el.classList.toggle("err", !!err); }
}
function openScanner(){
  if(document.querySelector(".scanWrap")) return;
  const wrap=document.createElement("div");
  wrap.className="scanWrap";
  wrap.innerHTML=`
    <div class="scanHead">📷 Scanner un produit <button id="scanClose" aria-label="Fermer">✕</button></div>
    <div id="scanView"></div>
    <div class="scanFoot">
      <div class="scanMsg" id="scanMsg">Démarrage de la caméra…</div>
      <div class="manual">
        <input id="scanManual" type="text" inputmode="numeric" placeholder="ou tape le code-barres (13 chiffres)">
        <button id="scanGo">OK</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector("#scanClose").onclick=closeScanner;
  scanFeedback("Démarrage de la caméra…", {quiet:true});

  loadH5Q().then(()=>{
    scanner=new Html5Qrcode("scanView", { formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,  Html5QrcodeSupportedFormats.UPC_E,
    ]});
    return scanner.start({facingMode:"environment"},
      {fps:10, qrbox:{width:260, height:160}},
      code=>handleBarcode(code),
      ()=>{});
  }).then(()=>{
    scanFeedback("Vise les codes-barres — chaque produit compte tout seul, pas besoin de toucher l'écran.", {quiet:true});
  }).catch(err=>{
    const m=String(err && err.message || err);
    scanMsg(/chargement/.test(m)
      ? "Impossible de charger le lecteur (pas de réseau ?). Tape le code à la main ci-dessous."
      : "Caméra indisponible : "+m+". Tape le code à la main ci-dessous.", true);
  });
}
function closeScanner(){
  const wrap=document.querySelector(".scanWrap");
  const done=()=>{ if(wrap) wrap.remove(); scanner=null; scanBusy=false; };
  if(scanner){ scanner.stop().then(done).catch(done); } else done();
}

/* Open Food Facts : lecture libre, sans clé. Le navigateur interdisant de
   fixer le User-Agent, on s'identifie via les paramètres de requête. */
async function lookupBarcode(code){
  const url=`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json`
    +`?fields=code,product_name,product_name_fr,brands,quantity`
    +`&app_name=${encodeURIComponent(OFF_UA)}`;
  const ctl=new AbortController();
  const to=setTimeout(()=>ctl.abort(), 8000);
  try{
    const r=await fetch(url,{signal:ctl.signal});
    clearTimeout(to);
    if(!r.ok) return null;
    const d=await r.json();
    if(!d || d.status!==1 || !d.product) return null;
    const p=d.product;
    const nom=[p.brands ? String(p.brands).split(",")[0].trim() : "",
               p.product_name_fr || p.product_name || ""].filter(Boolean).join(" ").trim();
    return {code, nom: nom || null, quantite: p.quantity || ""};
  }catch(e){ clearTimeout(to); return null; }
}

/* ---- Scan en continu, zéro clic ----------------------------------
   Objectif : enchaîner les paquets dans la cuisine sans jamais toucher
   l'écran. Chaque code détecté agit immédiatement :
     connu   → +1 sur son poste (bip aigu)
     inconnu → identité Open Food Facts, poste créé automatiquement,
               code rattaché, +1 (double bip)
   Les corrections (Annuler / Rattacher) sont des boutons OPTIONNELS dans
   le bandeau du bas — la caméra ne s'arrête jamais pour poser une question.

   Piège à connaître : le décodeur émet le même code ~10×/seconde tant que
   le paquet est devant la caméra. Un temps mort de 2,5 s par code évite
   les +10 accidentels ; re-viser le même paquet APRÈS le temps mort fait
   bien +1 — c'est comme ça qu'on compte trois paquets identiques. */
const SCAN_COOLDOWN_MS=2500;
const lastScanAt={};                 // code → timestamp de dernier traitement
let lastAction=null;                 // pour Annuler : {posteId, code, prevQty, created}

function beep(double){
  try{
    const ctx=beep.ctx||(beep.ctx=new (window.AudioContext||window.webkitAudioContext)());
    const note=(t,f)=>{ const o=ctx.createOscillator(), g=ctx.createGain();
      o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+.12);
      o.start(t); o.stop(t+.13); };
    note(ctx.currentTime, 880);
    if(double) note(ctx.currentTime+.15, 660);
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(double?[40,60,40]:40); }catch(e){}
}

async function handleBarcode(code){
  const now=Date.now();
  if(lastScanAt[code] && now-lastScanAt[code]<SCAN_COOLDOWN_MS) return; // même paquet encore devant la caméra
  lastScanAt[code]=now;
  if(scanBusy) return;               // un lookup OFF est déjà en cours

  /* 1) Code connu : incrément immédiat, la caméra continue. */
  const known=stock.ean[code];
  if(known){
    const p=stockItem(known);
    if(p){
      lastAction={posteId:p.id, code, prevQty:p.qty, created:false};
      setStockQty(p.id, p.qty+stepFor(p));
      beep(false);
      scanFeedback(`✅ ${p.nom} → ${stockItem(p.id).qty} ${p.unite||""}`);
      return;
    }
    delete stock.ean[code];          // le poste a disparu, on oublie le lien
  }

  /* 2) Code inconnu : identité OFF puis création automatique du poste. */
  scanBusy=true;
  scanFeedback("🔎 Nouveau produit, identification…", {quiet:true});
  try{
    const info=await lookupBarcode(code);
    const label=info && info.nom
      ? info.nom + (info.quantite ? ` (${info.quantite})` : "")
      : `Code ${code}`;
    let id=slugify(label)||("scan-"+code);
    const existed=!!stockItem(id);
    if(!existed)
      stock.custom.push({id, nom:label, categorie:"📦 Divers", unite:"pièce", seuil:1, famille:"", note:""});
    stock.ean[code]=id;
    const p=stockItem(id);
    lastAction={posteId:id, code, prevQty:p.qty, created:!existed};
    setStockQty(id, p.qty+1);
    saveStock();
    beep(true);
    scanFeedback(`🆕 ${label} → ${stockItem(id).qty}`, {correctable:true});
  }finally{
    lastScanAt[code]=Date.now();     // le lookup a pu durer : on repart de la fin
    scanBusy=false;
  }
}

/* Bandeau du bas : dernier scan + corrections optionnelles + saisie manuelle.
   Jamais bloquant — remplacé au scan suivant. */
function scanFeedback(msg, opts){
  const wrap=document.querySelector(".scanWrap"); if(!wrap) return;
  const foot=wrap.querySelector(".scanFoot");
  const o=opts||{};
  foot.innerHTML=`
    <div class="scanMsg" id="scanMsg">${esc(msg)}</div>
    ${o.quiet?"":`<div class="scanActions">
      ${lastAction?`<button id="scanUndo">↩︎ Annuler</button>`:""}
      ${o.correctable?`<button id="scanRelink">Rattacher à un poste existant</button>`:""}
    </div>`}
    <div class="manual">
      <input id="scanManual" type="text" inputmode="numeric" placeholder="ou tape le code-barres (13 chiffres)">
      <button id="scanGo">OK</button>
    </div>`;
  const on=(sel,fn)=>{ const el=foot.querySelector(sel); if(el) el.onclick=fn; };
  on("#scanUndo", undoLastScan);
  on("#scanRelink", ()=>askRelink(lastAction));
  on("#scanGo", ()=>{
    const v=(foot.querySelector("#scanManual").value||"").replace(/\D/g,"");
    if(v.length<8){ scanMsg("Un code-barres fait au moins 8 chiffres.", true); return; }
    delete lastScanAt[v];            // saisie volontaire : pas de temps mort
    handleBarcode(v);
  });
  const inp=foot.querySelector("#scanManual");
  if(inp) inp.addEventListener("keydown", e=>{ if(e.key==="Enter") on && foot.querySelector("#scanGo").click(); });
}
function undoLastScan(){
  if(!lastAction) return;
  const a=lastAction; lastAction=null;
  if(a.created){
    stock.custom=stock.custom.filter(p=>p.id!==a.posteId);
    delete stock.qty[a.posteId]; delete stock.seuil[a.posteId];
    delete stock.ean[a.code];
    saveStock(); render();
    scanFeedback(`↩︎ Poste supprimé. Vise le produit suivant.`, {quiet:true});
  }else{
    setStockQty(a.posteId, a.prevQty);
    scanFeedback(`↩︎ Annulé. Vise le produit suivant.`, {quiet:true});
  }
}
/* Le poste auto-créé n'était pas le bon ? On déplace la quantité et le
   code-barres vers un poste existant — le seul moment où un choix s'affiche,
   et uniquement parce qu'on l'a demandé. */
function askRelink(action){
  const wrap=document.querySelector(".scanWrap"); if(!wrap || !action) return;
  const foot=wrap.querySelector(".scanFoot");
  const others=stockItems().filter(p=>p.id!==action.posteId);
  if(!others.length){ scanFeedback("Aucun autre poste. Continue à scanner.", {quiet:true}); return; }
  foot.innerHTML=`
    <div class="scanMsg" id="scanMsg">Rattacher ce code à quel poste ?</div>
    <div class="manual" style="flex-direction:column; gap:6px">
      ${others.map(p=>`<button class="stapleOpt" data-st="${esc(p.id)}" style="width:100%">${esc(p.nom)} <span style="opacity:.7">(${p.qty} ${esc(p.unite||"")})</span></button>`).join("")}
      <button class="stapleOpt" data-cancel="1" style="width:100%; background:#333">Laisser tel quel</button>
    </div>`;
  foot.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{
    const target=stockItem(b.dataset.st);
    /* retire l'effet du scan sur le poste auto-créé */
    if(action.created){
      stock.custom=stock.custom.filter(p=>p.id!==action.posteId);
      delete stock.qty[action.posteId]; delete stock.seuil[action.posteId];
    }else{
      stock.qty[action.posteId]=action.prevQty;
    }
    stock.ean[action.code]=target.id;
    setStockQty(target.id, target.qty+stepFor(target));
    saveStock();
    lastAction={posteId:target.id, code:action.code, prevQty:target.qty, created:false};
    scanFeedback(`✅ ${target.nom} → ${stockItem(target.id).qty} ${target.unite||""} · code mémorisé`);
  });
  foot.querySelector("[data-cancel]").onclick=()=>scanFeedback("OK. Vise le produit suivant.", {quiet:true});
}

/* ---- Promos ---- */
function promoCard(d){
  const inList=state.items.some(i=>i.catalogId===d.cat.id);
  const upTxt = d.up ? ` · ${fmt(d.up.v)}/${UNIT_LABEL[d.up.u]}` : "";
  const forQ = d.q>1 ? ` pour ${d.q}` : "";
  const vs = d.q>1 ? `${esc(d.other && d.other.store.name)} à ${d.q}` : esc(d.other && d.other.store.name);
  let verdictLine;
  if(d.verdict==="deal")
    verdictLine=`<div class="vLine good">✅ ${Math.round(d.gain*100)} % moins cher que ${vs} (${fmt(d.other.cost)})</div>`;
  else if(d.verdict==="trap")
    verdictLine=`<div class="vLine bad">❌ ${vs} reste moins cher sans promo : ${fmt(d.other.cost)}</div>`;
  else
    verdictLine=`<div class="vLine unk">🔍 seul prix connu — à confirmer en relevant les autres enseignes</div>`;
  const qLine = d.q>1
    ? `<div class="vLine unk">ℹ️ Remise effective à partir de ${d.q} unités — à l'unité, tu paies le plein tarif (${fmt(d.base)})</div>`
    : "";
  const famLine = d.betterFam
    ? `<div class="vLine warnLine">💡 Meilleur rapport dans « ${esc(famLabel(d.cat.famille))} » : <b>${esc(d.betterFam.cat.name)}</b> chez ${esc(d.betterFam.store.name)} à ${fmt(d.betterFam.up)}/${UNIT_LABEL[d.betterFam.u]}</div>`
    : "";
  return `<div class="card promoCard ${d.verdict}">
    <div class="cmpHead">
      <b>${esc(d.cat.name)}</b>
      <span class="qtyTag">${esc(d.cat.unit||"")}</span>
    </div>
    ${freshnessTag(d.cat)}
    <div class="promoRow">
      <span class="promoTag">🏷 ${promoLabel(d.entry.promo)}</span>
      <span class="pStore" style="color:${d.store.color}">${esc(d.store.name)}</span>
      <span class="pPrice"><span class="strike">${fmt(d.base*d.q)}</span> <b>${fmt(d.net)}</b>${forQ}<span class="muted small">${upTxt}</span></span>
    </div>
    ${verdictLine}
    ${qLine}
    ${famLine}
    <div class="bactions">
      <button data-addpromo="${esc(d.cat.id)}">${inList?"✓ déjà dans la liste":"+ Ajouter à la liste"}</button>
    </div>
  </div>`;
}
function renderPromos(){
  const body=$("#promoBody");
  const all=promoDeals();
  if(all.length===0){
    body.innerHTML=`<div class="empty"><div class="big">🏷</div><b>Aucune promo dans le catalogue</b><div class="small">Les promos apparaissent ici dès qu'une colonne <code>promo_*</code> est remplie dans <code>data/prix.csv</code>.</div></div>`;
    return;
  }
  const deals=all.filter(d=>d.verdict==="deal");
  const traps=all.filter(d=>d.verdict==="trap");
  const unk=all.filter(d=>d.verdict==="unknown");
  let html=`<div class="card small muted">${all.length} promo(s) au catalogue — <b>${deals.length}</b> réellement avantageuse(s), <b>${traps.length}</b> en trompe-l'œil${unk.length?`, ${unk.length} à confirmer`:""}. Une remise n'est une bonne affaire que si elle bat le prix normal des concurrents.</div>`;
  if(deals.length){ html+=`<div class="catTitle">✅ Vraies bonnes affaires</div>`+deals.map(promoCard).join(""); }
  if(unk.length){ html+=`<div class="catTitle">🔍 À confirmer</div>`+unk.map(promoCard).join(""); }
  if(traps.length){ html+=`<div class="catTitle">❌ Trompe-l'œil</div>`+traps.map(promoCard).join(""); }
  body.innerHTML=html;
  body.querySelectorAll("[data-addpromo]").forEach(b=>b.onclick=()=>addItem(b.dataset.addpromo,null));
}

/* ---- Catalogue : parcours par rayon puis par famille ----
   Pensé pour tenir la charge quand le catalogue passe de 74 à 300+ réf :
   rayons repliés par défaut, familles regroupées, recherche qui déplie. */
let catQuery="", catOpen=new Set();
function groupCatalog(list){
  const byRay=new Map();
  for(const c of list){
    const r=c.cat||"📝 Autres";
    if(!byRay.has(r)) byRay.set(r,new Map());
    const fams=byRay.get(r);
    const f=c.famille||c.id;
    if(!fams.has(f)) fams.set(f,[]);
    fams.get(f).push(c);
  }
  return byRay;
}
function famLabel(f){ return String(f).replace(/-/g," "); }
function productRow(c){
  const best=bestStoreFor(c,1);
  const partial=!isComparable(c);
  const inList=state.items.some(i=>i.catalogId===c.id);
  const up = best ? unitPrice(c, best.cost, 1) : null;
  const price = best
    ? `<b>${fmt(best.cost)}</b> chez ${esc(best.store.name)}${up?` · ${fmt(up.v)}/${UNIT_LABEL[up.u]}`:""}${partial?" · prix partiels":""}`
    : `aucun prix connu`;
  return `<div class="prod">
    <div class="pmain">
      <div class="pname">${esc(c.name)}</div>
      <div class="psub">${esc(c.unit||"")}${c.unit?" · ":""}${price}${partial?` <span class="pTag" title="Prix non relevés dans toutes les enseignes">🔍</span>`:""}</div>
    </div>
    <button class="addP ${inList?"in":""}" data-add="${esc(c.id)}" aria-label="Ajouter ${esc(c.name)}">${inList?"✓":"+"}</button>
  </div>`;
}
function renderCatalogue(){
  const body=$("#catBody"), countEl=$("#catCount");
  const q=norm(catQuery.trim());
  const all=DATA.catalog;
  const hits = q ? all.filter(c=>norm(c.name).includes(q)||norm(famLabel(c.famille||"")).includes(q)) : all;

  countEl.textContent = q
    ? `${hits.length} résultat(s) pour « ${catQuery.trim()} » sur ${all.length} produits`
    : `${all.length} produits · ${new Set(all.map(c=>c.cat||"📝 Autres")).size} rayons — touche un rayon pour l'ouvrir`;

  if(all.length===0){
    body.innerHTML=`<div class="empty"><div class="big">📭</div><b>Catalogue vide</b><div class="small">Aucun prix relevé pour l'instant. Les produits apparaîtront ici au fur et à mesure des relevés en magasin, ajoutés dans <code>data/prix.csv</code>.</div></div>`;
    return;
  }
  if(hits.length===0){
    body.innerHTML=`<div class="empty"><div class="big">🔍</div><b>Aucun produit trouvé</b><div class="small">Essaie un autre mot, ou ajoute-le comme article libre depuis l'onglet Liste.</div></div>`;
    return;
  }
  const byRay=groupCatalog(hits);
  const rayons=[...byRay.keys()].sort((a,b)=>a.localeCompare(b,"fr"));
  let html="";
  rayons.forEach((r,ri)=>{
    const fams=byRay.get(r);
    const n=[...fams.values()].reduce((a,arr)=>a+arr.length,0);
    const open = q ? true : catOpen.has(r);
    html+=`<div class="ray">
      <button class="rayHead" data-ray="${ri}">
        <span>${esc(r)}</span>
        <span class="rayN">${n}<span class="chev">${open?"▾":"▸"}</span></span>
      </button>`;
    if(open){
      html+=`<div class="rayBody">`;
      const famKeys=[...fams.keys()].sort((a,b)=>famLabel(a).localeCompare(famLabel(b),"fr"));
      for(const f of famKeys){
        /* Tri par rapport qualité-prix : €/kg quand c'est calculable, sinon prix paquet */
        const key=c=>{
          const b=bestStoreFor(c,1); if(!b) return Infinity;
          const up=unitPrice(c, b.cost, 1);
          return up ? up.v : b.cost;
        };
        const prods=[...fams.get(f)].sort((a,b)=>key(a)-key(b));
        if(prods.length>1) html+=`<div class="famHead">${esc(famLabel(f))} · ${prods.length}</div>`;
        html+=prods.map(productRow).join("");
      }
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  body.innerHTML=html;
  body.querySelectorAll("[data-ray]").forEach(b=>b.onclick=()=>{
    const r=rayons[+b.dataset.ray];
    catOpen.has(r) ? catOpen.delete(r) : catOpen.add(r);
    renderCatalogue();
  });
  body.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addItem(b.dataset.add,null));
}

/* ---- Liste ---- */
/* Suggestions de départ : dérivées du catalogue réel, jamais codées en dur —
   une liste figée d'ids renverrait des boutons vides après une purge. */
function popularPicks(n){
  const seen=new Set(), out=[], rest=[];
  for(const c of DATA.catalog){
    if(!bestStoreFor(c,1)) continue;
    if(seen.has(c.famille)){ rest.push(c); continue; }   // une famille = une suggestion…
    seen.add(c.famille); out.push(c);
  }
  return out.concat(rest).slice(0,n);                    // …puis on complète si le catalogue est étroit
}
function renderList(){
  const body=$("#listBody");
  const sug = suggestionsHtml();
  if(state.items.length===0){
    const picks=popularPicks(8);
    body.innerHTML = sug + `
      <div class="empty">
        <div class="big">🧾</div>
        <div><b>Ta liste est vide</b></div>
        <div class="small">${picks.length
          ? "Ajoute des articles ci-dessus, ou pars d'une suggestion :"
          : "Ajoute des articles ci-dessus. Le catalogue de prix est vide — tout ce que tu ajoutes restera un article libre, sans comparaison."}</div>
        <div class="chips">${picks.map(c=>
          `<button class="chip" data-add="${esc(c.id)}">${esc(c.name)}${c.unit?` <span class="muted small">${esc(c.unit)}</span>`:""}</button>`
        ).join("")}</div>
      </div>`;
    bindSuggestions(body);
    body.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addItem(b.dataset.add,null));
    return;
  }
  const items = enrichedItems();
  const groups = {};
  for(const it of items){
    const g = it.cat ? it.cat.cat : "📝 Autres articles";
    (groups[g]=groups[g]||[]).push(it);
  }
  let html="";
  for(const [g,arr] of Object.entries(groups)){
    html+=`<div class="catTitle">${esc(g)}</div>`;
    for(const it of arr){
      const best = it.cat ? bestStoreFor(it.cat, it.qty) : null;
      let sub;
      if(it.orphan)    sub = "retiré du catalogue — plus de prix associé";
      else if(!it.cat) sub = "article libre — non comparé";
      else if(!best)   sub = esc(it.cat.unit)+" · aucun prix connu";
      else{
        const partial = !isComparable(it.cat);
        sub = esc(it.cat.unit)+" · "+(partial?"dès "+fmt(best.cost/it.qty)+" chez "+esc(best.store.name)+" (prix partiels)"
                                             :"dès "+fmt(best.cost/it.qty)+" chez "+esc(best.store.name));
      }
      html+=`
      <div class="item ${it.checked?"checked":""}" data-uid="${it.uid}">
        <button class="ck" data-act="check">${it.checked?"✓":""}</button>
        <div class="imain">
          <div class="iname">${esc(it.name)}</div>
          <div class="isub">${sub}</div>
        </div>
        <div class="qty">
          <button data-act="minus">−</button><span>${it.qty}</span><button data-act="plus">+</button>
        </div>
        <button class="del" data-act="del">✕</button>
      </div>`;
      if(it.cat) html+=stepBox(it);
    }
  }
  body.innerHTML=sug+html;
  bindSuggestions(body);
  body.querySelectorAll(".item").forEach(el=>{
    const uid=el.dataset.uid;
    el.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>itemAction(uid,b.dataset.act));
  });
  body.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>setQty(b.dataset.step, +b.dataset.to));
}

/* ---- Suggestions de Claude ------------------------------------------
   La liste de courses vit dans le navigateur : Claude ne peut donc pas y
   écrire directement. Il alimente data/suggestions.csv, versionné dans le
   repo, et l'app propose ici de les reprendre en un tap. C'est le canal
   par lequel « Claude ajoute quelque chose à la liste ». */
function activeSuggestions(){
  return SUGGEST.filter(s=>
    !stock.dismissed.includes(s.id) &&
    !state.items.some(i=>i.catalogId===s.id || (!i.catalogId && i.name===s.nom))
  );
}
function suggestionsHtml(){
  const list=activeSuggestions();
  if(!list.length) return "";
  return `<div class="card sugCard">
    <b>💡 ${list.length} suggestion(s) de Claude</b>
    ${list.map(s=>`<div class="sugRow">
      <span class="sugTxt"><b>${esc(s.nom)}</b>${s.raison?` <span class="muted small">— ${esc(s.raison)}</span>`:""}</span>
      <button class="sugAdd" data-sugadd="${esc(s.id)}">+</button>
      <button class="sugNo" data-sugno="${esc(s.id)}" aria-label="Refuser">✕</button>
    </div>`).join("")}
    <div class="bactions"><button data-sugall="1">+ Tout ajouter</button></div>
  </div>`;
}
function bindSuggestions(body){
  const take=s=>{
    if(s.id && catItem(s.id)) addItemSilent(s.id, null);
    else addItemSilent(null, s.nom);
  };
  body.querySelectorAll("[data-sugadd]").forEach(b=>b.onclick=()=>{
    const s=SUGGEST.find(x=>x.id===b.dataset.sugadd); if(!s) return;
    take(s); saveState(); render(); toast("Ajouté : "+s.nom);
  });
  body.querySelectorAll("[data-sugno]").forEach(b=>b.onclick=()=>{
    stock.dismissed.push(b.dataset.sugno); saveStock(); render();
  });
  const all=body.querySelector("[data-sugall]");
  if(all) all.onclick=()=>{
    const list=activeSuggestions();
    list.forEach(take); saveState(); render();
    toast(`${list.length} suggestion(s) ajoutée(s)`);
  };
}

function itemAction(uid, act){
  const it = state.items.find(i=>String(i.uid)===String(uid));
  if(!it) return;
  if(act==="plus") it.qty++;
  if(act==="minus") it.qty=Math.max(1,it.qty-1);
  if(act==="check") it.checked=!it.checked;
  if(act==="del") state.items=state.items.filter(i=>i!==it);
  saveState(); render();
}

/* Ajout sans toast ni rendu — pour les ajouts en lot (réassort de stock) */
function addItemSilent(catalogId, freeName){
  if(catalogId){
    const existing = state.items.find(i=>i.catalogId===catalogId);
    if(existing){ existing.qty++; return; }
    const c=catItem(catalogId); if(!c) return;
    state.items.push({uid:Date.now()+Math.random(), catalogId, name:c.name, qty:1, checked:false});
  }else if(freeName && freeName.trim()){
    state.items.push({uid:Date.now()+Math.random(), catalogId:null, name:freeName.trim(), qty:1, checked:false});
  }
}
function addItem(catalogId, freeName){
  if(catalogId){
    const existing = state.items.find(i=>i.catalogId===catalogId);
    if(existing){ existing.qty++; toast("Quantité +1 : "+existing.name); }
    else{
      const c=catItem(catalogId);
      state.items.push({uid:Date.now()+Math.random(), catalogId, name:c.name, qty:1, checked:false});
      toast("Ajouté : "+c.name);
    }
  }else if(freeName && freeName.trim()){
    state.items.push({uid:Date.now()+Math.random(), catalogId:null, name:freeName.trim(), qty:1, checked:false});
    toast("Ajouté : "+freeName.trim());
  }
  saveState(); render();
}

/* ---- Autocomplete ---- */
const input=$("#addInput"), sug=$("#suggest");
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
/* Suggestions groupées par famille : taper "fromage" ne doit pas cracher
   22 lignes à plat mais les familles, avec le moins cher de chaque. */
input.addEventListener("input", ()=>{
  const q=norm(input.value);
  if(q.length<1){ sug.hidden=true; return; }
  const hits = DATA.catalog.filter(c=>norm(c.name).includes(q)||norm(famLabel(c.famille||"")).includes(q));
  if(hits.length===0){ sug.hidden=true; return; }

  const fams=new Map();
  for(const c of hits){
    const f=c.famille||c.id;
    if(!fams.has(f)) fams.set(f,[]);
    fams.get(f).push(c);
  }
  const rows=[...fams.entries()].map(([f,arr])=>{
    const sorted=arr.map(c=>({c,best:bestStoreFor(c,1)}))
                    .sort((a,b)=>(a.best?a.best.cost:Infinity)-(b.best?b.best.cost:Infinity));
    return {f, pick:sorted[0], n:arr.length};
  }).sort((a,b)=>(a.pick.best?a.pick.best.cost:Infinity)-(b.pick.best?b.pick.best.cost:Infinity))
    .slice(0,8);

  const shown=rows.reduce((a,r)=>a+r.n,0);
  sug.innerHTML = rows.map(r=>{
    const c=r.pick.c, best=r.pick.best;
    const more = r.n>1 ? ` <span class="muted small">· ${r.n} réf. en ${esc(famLabel(r.f))}</span>` : "";
    return `<button data-id="${esc(c.id)}">
      <span>${esc(c.name)} <span class="muted small">· ${esc(c.unit||"")}</span>${more}</span>
      <b>${best?fmt(best.cost):"—"}</b>
    </button>`;
  }).join("") + (hits.length>shown
    ? `<button data-cat="1"><span class="muted small">+ ${hits.length-shown} autre(s) — voir dans le catalogue</span><b>📚</b></button>` : "");
  sug.hidden=false;
  sug.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    if(b.dataset.cat){
      catQuery=input.value; $("#catSearch").value=catQuery;
      input.value=""; sug.hidden=true; switchView("catalogue"); return;
    }
    addItem(b.dataset.id,null); input.value=""; sug.hidden=true; input.focus();
  });
});
input.addEventListener("keydown", e=>{
  if(e.key==="Enter"){ commitAdd(); }
});
document.addEventListener("click", e=>{ if(!e.target.closest(".addbar")) sug.hidden=true; });
$("#addBtn").onclick=commitAdd;
function commitAdd(){
  const q=norm(input.value);
  if(!q) return;
  const exact = DATA.catalog.find(c=>norm(c.name)===q) || DATA.catalog.filter(c=>norm(c.name).includes(q))[0];
  if(exact && norm(exact.name).includes(q)) addItem(exact.id,null);
  else addItem(null, input.value);
  input.value=""; sug.hidden=true;
}

/* ---- Comparateur ---- */
function renderCompare(){
  const body=$("#cmpBody");
  const items=enrichedItems();
  const {full, partial, free}=bucketItems(items);
  const priced=[...full, ...partial];
  if(items.length===0){
    body.innerHTML=`<div class="empty"><div class="big">⚖️</div><b>Rien à comparer</b><div class="small">Ajoute d'abord des articles à ta liste.</div></div>`;
    return;
  }
  const totals=storeTotals(full);
  let html="";
  if(full.length===0){
    html+=`<div class="card warn"><b>⚠️ Comparaison impossible</b><div class="small">Aucun article de ta liste n'a ses prix relevés dans les trois enseignes. Les prix connus sont affichés ci-dessous, mais aucun total par enseigne ne serait honnête.</div></div>`;
  }else{
    html+=`<div class="totalsGrid">`;
    const min=Math.min(...DATA.stores.map(s=>totals[s.id].adj));
    for(const s of DATA.stores){
      const t=totals[s.id];
      html+=`<div class="tstore" style="background:${s.color}${t.adj<=min+0.001?"":"cc"}">
        <div class="tname">${esc(s.name)}${t.adj<=min+0.001?" 🏆":""}</div>
        <div class="tval">${fmt(t.adj)}</div>
        ${t.missing.length?`<div class="tmiss">${t.missing.length} indispo.*</div>`:""}
      </div>`;
    }
    const anyMissing=DATA.stores.some(s=>totals[s.id].missing.length);
    html+=`</div><div class="small muted" style="margin:0 4px 10px">Total si tu achetais dans une seule enseigne, calculé sur les <b>${full.length} article(s) comparable(s)</b> — ceux dont le prix est connu (ou l'absence confirmée) dans les trois enseignes.${anyMissing?" * Articles indisponibles comptés au meilleur prix ailleurs.":""}</div>`;
  }
  if(partial.length){
    html+=`<div class="card warn"><b>🔍 ${partial.length} article(s) hors comparaison</b>
      <div class="small">Il manque des relevés : ${esc(partial.map(p=>p.name).join(", "))}. Ils sont exclus des totaux ci-dessus pour ne pas fausser le classement, mais leurs prix connus restent affichés.</div></div>`;
  }

  for(const it of priced){
    const best=bestStoreFor(it.cat,it.qty);
    html+=`<div class="card cmp">
      <div class="cmpHead"><b>${esc(it.name)}</b><span class="qtyTag">${esc(it.cat.unit)} × ${it.qty}</span></div>
      ${freshnessTag(it.cat)}
      <div class="prow">`;
    for(const s of DATA.stores){
      const e=it.cat.prices[s.id];
      const st=priceState(e);
      const c=cost(e,it.qty);
      if(st===P_NA){
        html+=`<div class="pcell na"><div class="sname">${esc(s.name)}</div><div class="pval">—</div><div class="punit">indispo.</div></div>`;
      }else if(st===P_UNKNOWN){
        html+=`<div class="pcell todo"><div class="sname">${esc(s.name)}</div><div class="pval">?</div><div class="punit">à relever</div></div>`;
      }else{
        const isBest = best && Math.abs(c-best.cost)<0.001;
        const hasPromo=!!e.promo;
        html+=`<div class="pcell ${isBest?"best":""}">
          <div class="sname">${esc(s.name)}</div>
          <div class="pval">${hasPromo?`<span class="strike">${fmt(e.p*it.qty)}</span>`:""}${fmt(c)}</div>
          <div class="punit">${unitPriceLabel(it.cat, c, it.qty)}</div>
          ${hasPromo?`<span class="promoTag">🏷 ${promoLabel(e.promo)}</span>`:""}
        </div>`;
      }
    }
    html+=`</div>`;
    html+=stepBox(it);
    const alts=alternativesFor(it);
    if(alts.length){
      html+=`<div class="altBox">`+alts.map(a=>{
        const e=a.c.prices[a.best.store.id];
        const p=e&&e.promo;
        const detail = a.up
          ? `${esc(a.c.unit)} · <b>${fmt(a.up.v)}/${UNIT_LABEL[a.up.u]}</b> chez ${esc(a.best.store.name)} <span class="altSave">−${Math.round(a.gain*100)}%</span> <span class="muted">(tu es à ${fmt(a.curUP.v)}/${UNIT_LABEL[a.curUP.u]})</span>`
          : `${fmt(a.best.cost)} chez ${esc(a.best.store.name)} <span class="altSave">−${fmt(a.save)}</span>`;
        return `<div class="alt">💡<span class="altTxt"><b>${esc(a.c.name)}</b> — ${detail}${p?` <span class="promoTag">🏷 ${promoLabel(p)}</span>`:""}</span><button class="altBtn" data-swap="${it.uid}" data-to="${a.c.id}">Remplacer</button></div>`;
      }).join("")+`</div>`;
    }
    html+=`</div>`;
  }
  if(free.length){
    html+=`<div class="catTitle">Non comparés</div><div class="card small muted">${free.map(f=>esc(f.name)).join(", ")} — articles libres, sans correspondance dans le catalogue de prix.</div>`;
  }
  body.innerHTML=html;
  body.querySelectorAll("[data-swap]").forEach(b=>b.onclick=()=>swapItem(b.dataset.swap, b.dataset.to));
  body.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>setQty(b.dataset.step, +b.dataset.to));
}

/* ---- Paniers ---- */
function renderBaskets(){
  const body=$("#basketBody");
  const items=enrichedItems();
  if(items.filter(i=>i.cat).length===0){
    body.innerHTML=`<div class="empty"><div class="big">🧺</div><b>Aucun panier à préparer</b><div class="small">Ajoute des articles comparables à ta liste.</div></div>`;
    return;
  }
  const {full}=bucketItems(items);
  const totals=storeTotals(full);            // classement : articles comparables uniquement
  const split=optimalSplit(items);           // panier pratique : tout ce qui a un prix connu
  const splitFull=optimalSplit(full);        // base honnête du calcul d'économie
  const ranked=[...DATA.stores].sort((a,b)=>totals[a.id].adj-totals[b.id].adj);
  const bestSingle=ranked[0];
  const saving=totals[bestSingle.id].adj-splitFull.total;

  let html=`<div class="toggle">
    <button class="${basketMode==="split"?"on":""}" data-mode="split">✂️ Répartition optimale</button>
    <button class="${basketMode==="single"?"on":""}" data-mode="single">🏬 Magasin unique</button>
  </div>`;

  if(basketMode==="split"){
    html+=`<div class="saveBox">
      <div class="small muted">Total optimisé (${DATA.stores.filter(s=>split.baskets[s.id].length).length} enseigne(s))</div>
      <div class="amt">${fmt(split.total)}</div>
      <div class="small">${full.length
        ? `dont <b>${fmt(Math.max(0,saving))}</b> d'économie vs tout acheter chez ${esc(bestSingle.name)}, calculé sur les ${full.length} article(s) comparable(s)`
        : `aucune économie chiffrable : aucun article n'a ses prix relevés dans les trois enseignes`}</div>
    </div>`;
    for(const s of DATA.stores){
      const arr=split.baskets[s.id];
      if(!arr.length) continue;
      const sub=arr.reduce((a,b)=>a+b.cost,0);
      html+=`<div class="card basket" style="border-left-color:${s.color}">
        <div class="bhead"><span class="bname" style="color:${s.color}">${esc(s.name)}</span><span class="btotal">${fmt(sub)}</span></div>
        ${arr.map(it=>`<div class="bline"><span class="n">${esc(it.name)} <span class="muted">× ${it.qty}</span>${isComparable(it.cat)?"":` <span class="pTag" title="Prix non relevés dans les autres enseignes">🔍</span>`}</span><span>${fmt(it.cost)}</span></div>`).join("")}
        <div class="bactions">
          <button data-copy="${s.id}">📋 Copier la liste</button>
          <a href="${s.url}" target="_blank" rel="noopener">↗ Ouvrir ${esc(s.name)}</a>
        </div>
      </div>`;
    }
    if(split.unmatched.length){
      html+=`<div class="card small muted">Non répartis : ${split.unmatched.map(f=>esc(f.name)).join(", ")}</div>`;
    }
  }else if(full.length===0){
    html+=`<div class="card warn"><b>⚠️ Classement impossible</b><div class="small">Aucun article de ta liste n'a ses prix relevés dans les trois enseignes — il n'y a rien à classer honnêtement. Passe en « Répartition optimale » pour voir les prix connus.</div></div>`;
  }else{
    html+=`<div class="small muted" style="margin:0 4px 10px">Classement si tu fais toutes tes courses dans une seule enseigne, sur les <b>${full.length} article(s) comparable(s)</b> :</div>`;
    ranked.forEach((s,i)=>{
      const t=totals[s.id];
      html+=`<div class="card rank">
        <div class="medal">${["🥇","🥈","🥉"][i]||"•"}</div>
        <div class="rmain">
          <b style="color:${s.color}">${esc(s.name)}</b>
          ${t.missing.length?`<div class="small muted">Indisponible(s), compté(s) au meilleur prix ailleurs : ${t.missing.map(esc).join(", ")}</div>`:`<div class="small muted">Tous les articles disponibles</div>`}
        </div>
        <div class="rtotal">${fmt(t.adj)}</div>
      </div>`;
    });
    html+=`<div class="card small muted">💡 Sur ces mêmes articles, la répartition optimale descend à <b>${fmt(splitFull.total)}</b>.</div>`;
  }
  body.innerHTML=html;
  body.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ basketMode=b.dataset.mode; renderBaskets(); });
  body.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copyBasket(b.dataset.copy));
}

function copyBasket(storeId){
  const split=optimalSplit(enrichedItems());
  const s=DATA.stores.find(x=>x.id===storeId);
  const arr=split.baskets[storeId];
  const txt=`Courses ${s.name} :\n`+arr.map(it=>`- ${it.name} × ${it.qty} (${fmt(it.cost)})`).join("\n")
    +`\nTotal : ${fmt(arr.reduce((a,b)=>a+b.cost,0))}`;
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(
    ()=>toast("Liste "+s.name+" copiée ✓"),
    ()=>toast("Copie impossible sur ce navigateur")
  );
}

/* ---- Source de données ----------------------------------------
   Priorité : 1) data/prix.csv (source de vérité, éditable dans Excel)
              2) /api/prices (fonction Netlify)
              3) données locales embarquées.
   CSV : séparateur ";", décimales "," ou ".",
   prix VIDE  = pas encore relevé (l'article sort des comparaisons),
   prix "x"   = produit indisponible dans cette enseigne (comparaison possible),
   promo = "-20%" | "1+1" | "2e-50", date_releve vide = prix simulé. */
function parseCSV(text){
  text = text.replace(/^\uFEFF/,"");
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return {catalog:[], lastDate:""};
  const head = lines[0].split(";").map(h=>h.trim().toLowerCase());
  const idx = {}; head.forEach((h,i)=>idx[h]=i);
  const num = v=>{
    v=(v||"").trim().replace(/€/g,"").replace(/\s/g,"").replace(",",".");
    if(!v) return null;
    const f=parseFloat(v); return isNaN(f)?null:f;
  };
  const promo = v=>{
    v=(v||"").trim().toLowerCase().replace(/\s/g,"");
    if(!v) return null;
    const m=v.match(/^-?(\d+)%$/); if(m) return {t:"pct",v:+m[1]};
    if(v==="1+1") return {t:"1+1"};
    if(v.startsWith("2e")||v.startsWith("2è")) return {t:"2e-50"};
    return null;
  };
  const catalog=[]; let lastDate="", nReleve=0;
  for(let i=1;i<lines.length;i++){
    const cells=lines[i].split(";");
    const g=n=>{const j=idx[n]; return j===undefined?"":(cells[j]||"").trim();};
    const name=g("nom"); if(!name) continue;
    const id=g("id")||norm(name).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
    const prices={};
    for(const s of ["delhaize","carrefour","colruyt"]){
      const raw=g("prix_"+s).toLowerCase();
      if(raw==="x"||raw==="-"||raw==="n/a"){ prices[s]={na:true}; continue; } // indispo. confirmée
      const p=num(raw);
      if(p===null){ prices[s]=null; continue; }                               // pas encore relevé
      const pr=promo(g("promo_"+s));
      prices[s]=pr?{p,promo:pr}:{p};
    }
    const d=g("date_releve");
    if(d){ nReleve++; if(d>lastDate) lastDate=d; }
    catalog.push({id, famille:g("famille")||id, name, unit:g("unite"),
      cat:g("categorie")||"📝 Autres", prices, releve:d||null});
  }
  return {catalog, lastDate, nReleve};
}
/* real : true = tout relevé, false = tout simulé, nombre = part relevée sur total */
function setBadges(srcTxt, real, total){
  $("#srcBadge").textContent = srcTxt;
  const d=$("#demoBadge");
  if(total===0){ d.textContent="Aucun produit"; d.classList.remove("real"); return; }
  if(typeof real === "number" && total && real>0 && real<total){
    d.textContent = `${real}/${total} relevés`;      // catalogue mixte : ne pas mentir
    d.classList.add("real");
  }else{
    d.textContent = real ? "Prix relevés" : "Prix simulés";
    d.classList.toggle("real", !!real);
  }
}
async function loadData(){
  // 1) CSV statique
  try{
    const r=await fetch("data/prix.csv");
    if(r.ok){
      const d=parseCSV(await r.text());
      if(d.catalog.length){
        DATA={stores:LOCAL_DATA.stores, catalog:d.catalog};
        setBadges(d.lastDate?"CSV · dernier relevé "+frDate(d.lastDate):"CSV · simulé",
                  d.nReleve, d.catalog.length);
        render(); return;
      }
    }
  }catch(e){}
  // 2) Fonction Netlify
  try{
    const ctl=new AbortController();
    const to=setTimeout(()=>ctl.abort(),4000);
    const r=await fetch("/api/prices",{signal:ctl.signal});
    clearTimeout(to);
    if(r.ok){
      const d=await r.json();
      if(d && Array.isArray(d.catalog) && Array.isArray(d.stores)){
        DATA=d;
        setBadges("API"+(d.simulated?" · simulé":""), !d.simulated);
        render(); return;
      }
    }
  }catch(e){}
  // 3) Plus aucune source : mieux vaut le dire que d'inventer des prix
  setBadges("Aucune donnée de prix", false, DATA.catalog.length);
  render();
}

/* Petit parseur CSV générique pour stock.csv et suggestions.csv :
   même séparateur ";", mêmes règles (ligne vide ignorée, BOM toléré). */
function parseRows(text){
  const lines=text.replace(/^﻿/,"").split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return [];
  const head=lines[0].split(";").map(h=>h.trim().toLowerCase());
  return lines.slice(1).map(l=>{
    const c=l.split(";"); const o={};
    head.forEach((h,i)=>o[h]=(c[i]||"").trim());
    return o;
  });
}
async function loadStockCsv(){
  try{
    const r=await fetch("data/stock.csv");
    if(!r.ok) return;
    STOCK=parseRows(await r.text())
      .filter(o=>o.id && o.nom)
      .map(o=>({id:o.id, nom:o.nom, categorie:o.categorie||"📦 Divers",
                unite:o.unite||"pièce", seuil:parseFloat((o.seuil||"0").replace(",","."))||0,
                famille:o.famille||"", note:o.note||""}));
  }catch(e){}
}
async function loadSuggestions(){
  try{
    const r=await fetch("data/suggestions.csv");
    if(!r.ok) return;
    SUGGEST=parseRows(await r.text())
      .filter(o=>o.nom)
      .map(o=>({id:o.id||slugify(o.nom), nom:o.nom, raison:o.raison||"", date:o.date||""}));
  }catch(e){}
}

Promise.all([loadStockCsv(), loadSuggestions()]).then(render);
