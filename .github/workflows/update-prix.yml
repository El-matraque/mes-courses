name: Mise à jour des prix
on: {schedule: [{cron: "0 5 * * 1"}], workflow_dispatch: {}}
jobs: {update: {runs-on: ubuntu-latest, permissions: {contents: write}, steps: [{uses: "actions/checkout@v4"}, {uses: "actions/setup-node@v4", with: {node-version: 20}}, {name: "Relever les prix via Apify", env: {APIFY_TOKEN: "${{ secrets.APIFY_TOKEN }}"}, run: "node scripts/fetch-prices.mjs"}, {name: "Commit du CSV", run: "git config user.name prix-bot && git config user.email actions@users.noreply.github.com && git add data/prix.csv && (git diff --cached --quiet || git commit -m \"maj prix $(date +%F)\") && git push"}]}}
